<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>天天和警长的森林探案</title>
<style>
  @font-face { font-family: 'ZCOOL KuaiLe'; src: url("game/font_zh.woff2") format('woff2'); font-display: swap; }
  @font-face { font-family: 'Fredoka'; src: url("game/font_en.woff2") format('woff2'); font-weight: 500 700; font-display: swap; }
  :root { --night: #112219; --forest: #1c3526; --gold: #ffd27a; --cream: #fff7e6; }
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--night); color: var(--cream); overflow: hidden;
    font-family: "ZCOOL KuaiLe", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  }
  svg#stage {
    width: min(98vw, 180vh); max-height: 98vh; height: auto; display: block; border-radius: 18px;
    box-shadow: 0 22px 64px rgba(0, 0, 0, .65); background: var(--forest); touch-action: manipulation;
  }
  svg#stage text { font-family: "ZCOOL KuaiLe", "PingFang SC", sans-serif; }
  svg#stage .latin { font-family: "Fredoka", "Nunito", "Arial Rounded MT Bold", sans-serif; font-weight: 700; }

  @keyframes moteDrift { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(12px, -14px) scale(1.18); } }
  .mote { animation: moteDrift 10s ease-in-out infinite; }
  @keyframes flicker { 0%, 100% { opacity: .6; } 50% { opacity: .95; } }
  .flicker { animation: flicker 4s ease-in-out infinite; }
  @keyframes bobSlow { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  .bobSlow { animation: bobSlow 3s ease-in-out infinite; }
  @keyframes rippleRing { 0% { transform: scale(.85); opacity: .78; } 100% { transform: scale(1.9); opacity: 0; } }
  .ux-ripple { animation: rippleRing 1.3s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes petalFall {
    0% { transform: translateY(-30px) rotate(0deg); opacity: 0; }
    12% { opacity: .92; }
    85% { opacity: .88; }
    100% { transform: translateY(550px) rotate(320deg); opacity: 0; }
  }
  .fin-petal { animation: petalFall 5.6s linear infinite; }

  .ux-btn { cursor: pointer; }
  .ux-btn .btn-vis { transition: transform .16s ease, filter .16s ease; }
  .ux-btn:hover .btn-vis, .ux-btn:focus-visible .btn-vis { transform: scale(1.06); filter: drop-shadow(0 0 12px rgba(255, 224, 150, .85)); }
  .ux-btn:active .btn-vis { transform: scale(.94); }
  .ux-btn:focus-visible { outline: none; }
  .ux-btn.is-hold .btn-vis { filter: drop-shadow(0 0 14px rgba(154, 240, 178, .9)); }
  .ux-btn[data-state="lock"] { cursor: default; }
  .ux-btn[data-state="lock"]:hover .btn-vis { transform: none; filter: none; }

  .hotspot { cursor: pointer; transition: transform .18s ease; }
  .hotspot:hover { filter: drop-shadow(0 0 10px rgba(255, 236, 155, .9)); }
  .stone-btn { cursor: pointer; }
  .stone-btn:hover .stone-vis, .stone-btn:focus-visible .stone-vis { transform: scale(1.07); filter: drop-shadow(0 0 14px rgba(255, 218, 122, .95)); }
  .stone-btn:active .stone-vis { transform: scale(.93); }
  .stone-btn:focus-visible { outline: none; }

  @keyframes uxShake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }
  .ux-shake { animation: uxShake .32s ease-out; }
  @keyframes uxPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.09); } }
  .ux-pulse > .btn-vis, .ux-pulse > .stone-vis, .ux-anim-pulse { animation: uxPulse 1.3s ease-in-out infinite; }
  @keyframes uxPop { 0% { opacity: 0; transform: scale(.45); } 65% { transform: scale(1.08); } 100% { opacity: 1; transform: scale(1); } }
  .ux-pop { opacity: 0; transform: scale(.45); }
  .ux-pop.on { opacity: 1; transform: scale(1); animation: uxPop .42s cubic-bezier(.2, .9, .3, 1.3) both; }
  @keyframes pageIn { from { opacity: 0; } to { opacity: 1; } }
  .page { animation: pageIn .35s ease; }

  #padFocus rect { fill: none; stroke: #ffd27a; stroke-width: 5; opacity: .95; }
  #modal { pointer-events: auto; }
  #modal input, #modal select { font: inherit; }

  #turn {
    display: none; position: fixed; inset: 0; z-index: 20; background: var(--night);
    align-items: center; justify-content: center;
  }
  #turn svg { width: min(55vw, 55vh); height: auto; }
  @keyframes turnHint { 0%, 25% { transform: rotate(0deg); } 65%, 100% { transform: rotate(-90deg); } }
  #turn .tablet { transform-origin: 120px 120px; animation: turnHint 2.6s ease-in-out infinite; }
  @media (orientation: portrait) {
    #turn { display: flex; }
    svg#stage { visibility: hidden; }
  }
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 960 520" role="img" aria-label="天天和警长的森林探案游戏画面">
  <defs>
    <radialGradient id="warm"><stop offset="0" stop-color="#ffd98e" stop-opacity=".75"/><stop offset=".5" stop-color="#ffb85f" stop-opacity=".28"/><stop offset="1" stop-color="#ffb85f" stop-opacity="0"/></radialGradient>
    <radialGradient id="sun"><stop offset="0" stop-color="#fff8d6" stop-opacity=".65"/><stop offset=".6" stop-color="#ffe08a" stop-opacity=".22"/><stop offset="1" stop-color="#ffe08a" stop-opacity="0"/></radialGradient>
    <radialGradient id="cool"><stop offset="0" stop-color="#9fe8ff" stop-opacity=".65"/><stop offset="1" stop-color="#9fe8ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="rose"><stop offset="0" stop-color="#ff9ec4" stop-opacity=".62"/><stop offset="1" stop-color="#ff9ec4" stop-opacity="0"/></radialGradient>
    <radialGradient id="vignette" cx=".5" cy=".48" r=".74"><stop offset=".62" stop-color="#112219" stop-opacity="0"/><stop offset="1" stop-color="#112219" stop-opacity=".46"/></radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0a160f" flood-opacity=".42"/></filter>
    <filter id="silhouette" x="-5%" y="-5%" width="110%" height="110%"><feColorMatrix type="matrix" values="0 0 0 0 .35  0 0 0 0 .45  0 0 0 0 .38  0 0 0 .92 0"/></filter>
    <linearGradient id="plateGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".96"/><stop offset="1" stop-color="#e4f3d8" stop-opacity=".92"/></linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffefba"/><stop offset="1" stop-color="#ffbe52"/></linearGradient>
    <linearGradient id="storyTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#112219" stop-opacity=".82"/><stop offset=".65" stop-color="#112219" stop-opacity=".45"/><stop offset="1" stop-color="#112219" stop-opacity="0"/></linearGradient>
    <linearGradient id="bottomFade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#112219" stop-opacity="0"/><stop offset="1" stop-color="#112219" stop-opacity=".76"/></linearGradient>
  </defs>
  <image id="bg" x="-10" y="-4" width="980" height="528" preserveAspectRatio="xMidYMid slice"/>
  <g id="glows"></g>
  <g id="motesBack" aria-hidden="true"></g>
  <g id="ambient" aria-hidden="true"></g>
  <g id="hotspots"></g>
  <g id="workshop"></g>
  <g id="shadows"></g>
  <g id="actors"></g>
  <g id="fx"></g>
  <g id="motesFront" aria-hidden="true"></g>
  <rect id="veil" width="960" height="520" fill="#112219" opacity="0" pointer-events="none"/>
  <rect width="960" height="520" fill="url(#vignette)" pointer-events="none"/>
  <g id="talk" aria-live="polite"></g>
  <g id="hud"></g>
  <g id="overlay"></g>
  <g id="modal"></g>
  <g id="padFocus" pointer-events="none" visibility="hidden"><rect rx="18"/></g>
  <g id="subs" pointer-events="none"></g>
</svg>

<div id="turn" role="img" aria-label="请把平板横过来">
  <svg viewBox="0 0 240 240" aria-hidden="true">
    <rect x="30" y="30" width="180" height="180" rx="40" fill="#1c3526" opacity=".75"/>
    <g class="tablet">
      <rect x="82" y="46" width="76" height="148" rx="12" fill="#fff7e6" stroke="#ffd27a" stroke-width="6"/>
      <rect x="90" y="58" width="60" height="112" rx="5" fill="#2c593e"/>
      <circle cx="120" cy="182" r="5" fill="#a8c9a0"/>
    </g>
    <path d="M178 60a74 74 0 0 1 20 54" fill="none" stroke="#ffd27a" stroke-width="9" stroke-linecap="round"/>
    <path d="M186 106l12 12 12-14z" fill="#ffd27a" stroke="#ffd27a" stroke-width="5" stroke-linejoin="round"/>
  </svg>
</div>

<script id="logic">
/*LOGIC*/
</script>

<script id="view">
/*VIEW*/
</script>
</body>
</html>
