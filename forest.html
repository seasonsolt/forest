<style>
  @font-face { font-family: 'ZCOOL KuaiLe'; src: url("game/font_zh.woff2?v=b6d3e7aede95") format('woff2'); font-display: swap; }
  @font-face { font-family: 'Fredoka'; src: url("game/font_en.woff2?v=b6d3e7aede95") format('woff2'); font-weight: 500 700; font-display: swap; }
  :root { --night: #112219; --forest: #1c3526; --gold: #ffd27a; --cream: #fff7e6; }
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--night); color: var(--cream); overflow: hidden;
    font-family: "ZCOOL KuaiLe", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  }
  svg#stage {
    width: min(98vw, 180vh); max-height: 98vh; height: auto; display: block; border-radius: 18px;
    box-shadow: 0 22px 64px rgba(0, 0, 0, .65); background: var(--forest); touch-action: manipulation;
  }
  svg#stage text { font-family: "ZCOOL KuaiLe", "PingFang SC", sans-serif; }
  svg#stage .latin { font-family: "Fredoka", "Nunito", "Arial Rounded MT Bold", sans-serif; font-weight: 700; }

  @keyframes moteDrift { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(12px, -14px) scale(1.18); } }
  .mote { animation: moteDrift 10s ease-in-out infinite; }
  @keyframes flicker { 0%, 100% { opacity: .6; } 50% { opacity: .95; } }
  .flicker { animation: flicker 4s ease-in-out infinite; }
  @keyframes bobSlow { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  .bobSlow { animation: bobSlow 3s ease-in-out infinite; }
  @keyframes rippleRing { 0% { transform: scale(.85); opacity: .78; } 100% { transform: scale(1.9); opacity: 0; } }
  .ux-ripple { animation: rippleRing 1.3s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes petalFall {
    0% { transform: translateY(-30px) rotate(0deg); opacity: 0; }
    12% { opacity: .92; }
    85% { opacity: .88; }
    100% { transform: translateY(550px) rotate(320deg); opacity: 0; }
  }
  .fin-petal { animation: petalFall 5.6s linear infinite; }

  .ux-btn { cursor: pointer; }
  .ux-btn .btn-vis { transition: transform .16s ease, filter .16s ease; }
  .ux-btn:hover .btn-vis, .ux-btn:focus-visible .btn-vis { transform: scale(1.06); filter: drop-shadow(0 0 12px rgba(255, 224, 150, .85)); }
  .ux-btn:active .btn-vis { transform: scale(.94); }
  .ux-btn:focus-visible { outline: none; }
  .ux-btn.is-hold .btn-vis { filter: drop-shadow(0 0 14px rgba(154, 240, 178, .9)); }
  .ux-btn[data-state="lock"] { cursor: default; }
  .ux-btn[data-state="lock"]:hover .btn-vis { transform: none; filter: none; }

  .hotspot { cursor: pointer; transition: transform .18s ease; }
  .hotspot:hover { filter: drop-shadow(0 0 10px rgba(255, 236, 155, .9)); }
  .stone-btn { cursor: pointer; }
  .stone-btn:hover .stone-vis, .stone-btn:focus-visible .stone-vis { transform: scale(1.07); filter: drop-shadow(0 0 14px rgba(255, 218, 122, .95)); }
  .stone-btn:active .stone-vis { transform: scale(.93); }
  .stone-btn:focus-visible { outline: none; }

  @keyframes uxShake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }
  .ux-shake { animation: uxShake .32s ease-out; }
  @keyframes uxPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.09); } }
  .ux-pulse > .btn-vis, .ux-pulse > .stone-vis, .ux-anim-pulse { animation: uxPulse 1.3s ease-in-out infinite; }
  @keyframes uxPop { 0% { opacity: 0; transform: scale(.45); } 65% { transform: scale(1.08); } 100% { opacity: 1; transform: scale(1); } }
  .ux-pop { opacity: 0; transform: scale(.45); }
  .ux-pop.on { opacity: 1; transform: scale(1); animation: uxPop .42s cubic-bezier(.2, .9, .3, 1.3) both; }
  @keyframes pianoHit { 0% { transform: scale(1); } 35% { transform: scale(1.13); filter: drop-shadow(0 0 14px rgba(255, 224, 130, .95)); } 100% { transform: scale(1); } }
  .piano-hit > .btn-vis { animation: pianoHit .36s cubic-bezier(.2, .9, .3, 1.3); }
  @keyframes pageIn { from { opacity: 0; } to { opacity: 1; } }
  .page { animation: pageIn .35s ease; }

  #padFocus rect { fill: none; stroke: #ffd27a; stroke-width: 5; opacity: .95; }
  #modal { pointer-events: auto; }
  #modal input, #modal select { font: inherit; }

  #turn {
    display: none; position: fixed; inset: 0; z-index: 20; background: var(--night);
    align-items: center; justify-content: center;
  }
  #turn svg { width: min(55vw, 55vh); height: auto; }
  @keyframes turnHint { 0%, 25% { transform: rotate(0deg); } 65%, 100% { transform: rotate(-90deg); } }
  #turn .tablet { transform-origin: 120px 120px; animation: turnHint 2.6s ease-in-out infinite; }
  @media (orientation: portrait) {
    #turn { display: flex; }
    svg#stage { visibility: hidden; }
  }
</style>

/* Pure game state machine for 天天和警长的森林探案 (<script id="logic">). Zero DOM access; runs in Node tests and browser. */
const STAGE_W = 960;
const STAGE_H = 520;
const IDLE_HINT_SEC = 12;

function createGame() {
  const g = {
    state: 'title',   // 'title' | 'play' | 'clear' | 'win'
    index: 0,
    screen: 0,        // 0 = Scene A (Letter Clue Hunt), 1 = Scene B (Letter Workshop)
    time: 0,
    idleTime: 0,
    hintTarget: null,
    workshopReady: false,
    memoryFound: false,
    hotspots: [],
    orbs: { got: 0, total: 4, words: [] },
    acorns: { got: 0, total: 1 },
    stars: { got: 0, total: 1 },
    skye: { x: 165, y: 150, tx: 165, ty: 150, facing: 1, cheer: 0 },
    labrador: { x: 120, y: 405, tx: 120, ty: 405, facing: 1, cheer: 0 },
    workshop: null,
    events: [],

    level() {
      return LEVELS[g.index];
    },

    emit(ev) {
      g.events.push(ev);
    },

    drain() {
      return g.events.splice(0, g.events.length);
    },

    load(i) {
      const idx = Math.max(0, Math.min(LEVELS.length - 1, i | 0));
      const lv = LEVELS[idx];
      g.index = idx;
      g.screen = 0;
      g.time = 0;

      g.load(i);
      g.state = 'play';
    },

    currentRound() {
      const w = g.workshop;
      return w && w.rounds[w.roundIdx] ? w.rounds[w.roundIdx] : null;
    },

    currentChoices() {

      return r ? r.choices : [];

      g.hintTarget = null;

        if (g.workshopReady) return { screen: 0, kind: 'workshop' };

        const nextAny = g.hotspots.find(h => !h.opened);
        return nextAny ? { screen: 0, kind: 'hotspot', id: nextAny.id } : null;
      }

    },

    tapStone(choice) {
      if (g.state !== 'play' || g.screen !== 1 || !g.workshop) return false;
      const w = g.workshop, r = g.currentRound();

        }

      }

      w.pickedLetter = val;
      w.step = 'done';
      w.misses = 0;
      w.assistGlow = false;

      } else {

        w.step = 'pick';
        w.pickedLetter = '';
      }
      return true;
    },

    cheerFriend(who) {
      if (who === 'skye') { g.skye.cheer = 1.0; g.emit({ type: 'cheer', who: 'skye' }); return true; }
      if (who === 'labrador') { g.labrador.cheer = 1.0; g.emit({ type: 'cheer', who: 'labrador' }); return true; }
      return false;
    },

    step(dt) {
      if (g.state !== 'play') return;
      const clamped = Math.min(0.05, Math.max(0, dt || 0));

        if (g.hintTarget) g.emit({ type: 'hint_auto', target: g.hintTarget });
      }
    },
  };
  return g;
}

  function drawSceneA(g) {

          nxBtn.addEventListener('click', o.onNext);

  function renderStage(g, force) {
    const lv = g.level();
    const w = g.workshop;
    const opened = g.hotspots.filter(h => h.opened).length;
    const needStatic = force || sceneDrawn.idx !== g.index;
    const needScene = needStatic || sceneDrawn.screen !== g.screen || sceneDrawn.opened !== opened || sceneDrawn.workshopReady !== g.workshopReady
      || (g.screen === 1 && w && (sceneDrawn.round !== w.roundIdx || sceneDrawn.step !== w.step || sceneDrawn.assist !== w.assistGlow || sceneDrawn.pickedLetter !== w.pickedLetter));
    if (needStatic) drawStageStatic(lv);
    if (needScene) {
      if (g.screen === 0) drawSceneA(g);
      else drawSceneB(g);
      sceneDrawn = {
        idx: g.index, screen: g.screen, opened, round: w ? w.roundIdx : -1, step: w ? w.step : '',
        workshopReady: g.workshopReady, assist: !!(w && w.assistGlow), pickedLetter: w ? w.pickedLetter : '',
      };
      if (typeof syncHud === 'function') syncHud();
    }
  }
  /* Hero pup rendering (Skye hovering + Sheriff Labrador standing/searching), grounded shadows, outfit & hat overlays, and pointer-tap cheers. */
  const pupState = { built: false, skyePose: '', labPose: '', skyeDress: -1, labDress: -1, skyeHat: null, labHat: null, panX: 0 };

  function placeHat(parent, who, pose, hat) {
    if (!hat) return;
    const hName = 'hat_' + hat;
    if (!SIZES[hName]) return;
    const [hw, hh] = SIZES[hName];
    const isBand = hat === 'bow' || hat === 'butterfly';
    const scale = isBand ? (who === 'skye' ? .48 : .52) : (who === 'skye' ? .42 : .45);
    const w = hw * scale, h = hh * scale;
    const dx = who === 'skye'
      ? (pose === 'fly' ? 11 : (pose === 'idle' ? 8 : 4))
      : (pose === 'cheer' ? -2 : (pose === 'search' ? 5 : (pose === 'walk' ? 3 : 2)));
    const bandDy = hat === 'bow' ? 10 : (hat === 'butterfly' ? 7 : 0);
    const dy = (who === 'skye'
      ? (pose === 'cheer' ? -110 : -106)
      : (pose === 'cheer' ? -131 : -126)) + bandDy;
    img(hName, dx - w / 2, dy - h / 2, w, h, parent);
  }

  function buildActors() {
    const box = $('actors');
    const sh = $('shadows');
    box.textContent = '';
    sh.textContent = '';
    el('ellipse', { id: 'shLab', cx: 120, cy: 430, rx: 46, ry: 11, fill: '#0b1811', opacity: '.32' }, sh);
    el('ellipse', { id: 'shSkye', cx: 165, cy: 410, rx: 32, ry: 8, fill: '#0b1811', opacity: '.22' }, sh);

    const labG = el('g', { id: 'actLab', class: 'hotspot', role: 'button', tabindex: '0', 'aria-label': '拉布拉多警长' }, box);
    const skyeG = el('g', { id: 'actSkye', class: 'hotspot', role: 'button', tabindex: '0', 'aria-label': '天天' }, box);
    labG.addEventListener('click', () => onPupTap('labrador'));
    skyeG.addEventListener('click', () => onPupTap('skye'));
    pupState.built = true;
    pupState.skyePose = '';
    pupState.labPose = '';
  }

  function dressReady(who, k) {
    return (k === 1 || k === 2) && !!SIZES[`${who}_idle`] && (who === 'skye' ? !!SIZES.skye_fly : !!SIZES.labrador_walk);
  }

  function spriteFile(who, pose, dress) {
    return (dress === 1 || dress === 2) && dressReady(who, dress) ? `${who}_${pose}_d${dress}` : `${who}_${pose}`;
  }

  function renderPupNode(node, who, pose, outfit) {
    node.textContent = '';
    const baseKey = `${who}_${pose}`;
    const [pw, ph] = SIZES[baseKey] || (who === 'skye' ? [190, 190] : [220, 240]);
    const scale = 0.52;
    const dw = pw * scale, dh = ph * scale;
    img(spriteFile(who, pose, outfit.dress), -dw / 2, -dh, dw, dh, node);
    placeHat(node, who, pose, outfit.hat);
  }

  function renderPups(g, now) {
    if (!pupState.built) buildActors();
    const oS = (save.outfit && save.outfit.skye) || { dress: 0, hat: null };
    const oL = (save.outfit && save.outfit.labrador) || { dress: 0, hat: null };
    const skyePose = g.skye.cheer > 0.05 ? 'cheer' : (g.screen === 0 ? 'fly' : 'idle');
    const labPose = g.labrador.cheer > 0.05 ? 'cheer' : (g.screen === 0 ? 'search' : 'idle');

    const skyeG = $('actSkye'), labG = $('actLab');
    if (pupState.skyePose !== skyePose || pupState.skyeDress !== oS.dress || pupState.skyeHat !== oS.hat) {
      renderPupNode(skyeG, 'skye', skyePose, oS);
      pupState.skyePose = skyePose; pupState.skyeDress = oS.dress; pupState.skyeHat = oS.hat;
    }
    if (pupState.labPose !== labPose || pupState.labDress !== oL.dress || pupState.labHat !== oL.hat) {
      renderPupNode(labG, 'labrador', labPose, oL);
      pupState.labPose = labPose; pupState.labDress = oL.dress; pupState.labHat = oL.hat;
    }

    const hoverBob = Math.sin(now * 3.1) * 5;
    const sqY = g.skye.cheer > 0 ? 1 + Math.sin(g.skye.cheer * 14) * 0.06 : 1;
    const sx = g.skye.x, sy = g.skye.y + hoverBob;
    skyeG.setAttribute('transform', `translate(${sx.toFixed(1)} ${sy.toFixed(1)}) scale(${g.skye.facing} ${sqY.toFixed(3)})`);
    const lx = g.labrador.x, ly = g.labrador.y + 28;
    const lsq = g.labrador.cheer > 0 ? 1 + Math.sin(g.labrador.cheer * 12) * 0.05 : 1;
    labG.setAttribute('transform', `translate(${lx.toFixed(1)} ${ly.toFixed(1)}) scale(${g.labrador.facing} ${lsq.toFixed(3)})`);

    // Grounded shadows scale dynamically with hover height
    const shSkye = $('shSkye'), shLab = $('shLab');
    const groundY = 428;
    const dist = Math.max(0, groundY - sy);
    const sScale = Math.max(0.42, 1 - dist / 480);
    if (shSkye) {
      shSkye.setAttribute('cx', sx.toFixed(1));
      shSkye.setAttribute('cy', String(groundY));
      shSkye.setAttribute('rx', (36 * sScale).toFixed(1));
      shSkye.setAttribute('ry', (9 * sScale).toFixed(1));
    }
    if (shLab) {
      shLab.setAttribute('cx', lx.toFixed(1));
      shLab.setAttribute('cy', ly.toFixed(1));
    }
  }
  /* Particle bursts, confetti, flying orb arcs, and 12s idle magnifying-glass sparkle guide. */
  const fxList = [];

  function uxConfetti(parent, x, y, count) {
    const host = parent || $('fx');
    const cols = ['#ffd27a', '#ff8cb8', '#9be88d', '#8cd6ff', '#ffffff'];
    for (let i = 0; i < (count || 16); i++) {
      const a = (Math.PI * 2 * i) / (count || 16) + Math.random() * .4;
      const sp = 55 + Math.random() * 95;
      const node = el('circle', { cx: x, cy: y, r: 3.2 + Math.random() * 2.5, fill: cols[i % cols.length] }, host);
      fxList.push({ node, x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 45, g: 210, t: 0, dur: .75 + Math.random() * .35, kind: 'pop' });
    }
  }

  function spawnOrbArc(fromX, fromY, toX, toY) {
    const box = $('fx');
    const node = img('prop_orb', -20, -20, 40, 40, box);
    fxList.push({ node, x: fromX, y: fromY, sx: fromX, sy: fromY, tx: toX, ty: toY, t: 0, dur: .65, kind: 'arc' });
  }

  function renderIdleGuide(g, now) {
    let guide = $('guideRing');
    if (!g.hintTarget || g.state !== 'play') {
      if (guide) guide.remove();
      return;
    }
    if (!guide) guide = el('g', { id: 'guideRing', 'pointer-events': 'none' }, $('fx'));
    let gx = 480, gy = 300;
    if (g.hintTarget.screen === 0) {
      if (g.hintTarget.kind === 'workshop') { gx = 840; gy = 430; }
      else {
        const h = g.hotspots.find(x => x.id === g.hintTarget.id);
        if (h) { gx = h.x; gy = h.y; }
      }
    } else if (g.hintTarget.screen === 1) {
      const choices = g.currentChoices();
      const idx = choices.indexOf(g.hintTarget.val);
      gx = [250, 480, 710][idx >= 0 ? idx : 1];
      gy = 428;
    }
    const r = 52 + Math.sin(now * 5) * 6;
    guide.innerHTML = `<circle cx="${gx}" cy="${gy}" r="${r.toFixed(1)}" fill="none" stroke="#ffd27a" stroke-width="5" stroke-dasharray="10 6" opacity=".92"/>
      <circle cx="${gx}" cy="${gy}" r="${(r - 12).toFixed(1)}" fill="#ffe89c" opacity=".16"/>`;
  }

  function fxTick(dt, now, g) {
    for (let i = fxList.length - 1; i >= 0; i--) {
      const f = fxList[i];
      f.t += dt;
      const p = Math.min(1, f.t / f.dur);
      if (f.kind === 'arc') {
        const u = 1 - Math.pow(1 - p, 2);
        const cx = f.sx + (f.tx - f.sx) * u;
        const cy = f.sy + (f.ty - f.sy) * u - Math.sin(u * Math.PI) * 90;
        const sc = 1 - u * .45;
        f.node.setAttribute('transform', `translate(${cx.toFixed(1)} ${cy.toFixed(1)}) scale(${sc.toFixed(2)})`);
        f.node.setAttribute('opacity', String(1 - u * .2));
      } else {
        f.vy += f.g * dt;
        f.x += f.vx * dt;
        f.y += f.vy * dt;
        f.node.setAttribute('cx', f.x.toFixed(1));
        f.node.setAttribute('cy', f.y.toFixed(1));
        f.node.setAttribute('opacity', (1 - p).toFixed(2));
      }

  /* ---------- clear page: 3 stars -> word cards -> listening quiz ---------- */
  function showClear(level, done) {
    const lv = uxLevel(level), idx = uxLevelIndex(lv), words = uxRoomWords(lv), s = uxScreen('clear');
    const memory = !!game.memoryFound, acorns = !game.acorns || game.acorns.total === 0 ? true : game.acorns.got >= game.acorns.total;
    const got = [true, memory, acorns];
    s.seq = 0;

    const starsHtml = got.map((g, k) => `<g transform="translate(${(k - 1) * 140} 0)"><g class="ux-pop" data-pop="s${k}">
      ${g ? '<circle r="60" fill="#fff2b5" opacity=".32"/>' : ''}

    uxPaint(`<g class="page">

      <g id="uxBody"></g><g id="uxCtl"></g>
    </g>`);
    const root = $('overlay'), body = root.querySelector('#uxBody'), ctl = root.querySelector('#uxCtl');
    const mark = () => { const me = ++s.seq; return () => uxAlive(s) && s.seq === me; };
    const setCtl = html => { ctl.innerHTML = html; uxBind(ctl, { next: () => s.onKey && s.onKey(), replay: () => { if (uxAlive(s)) { uxEnd(s, null); uxHooks.replay(idx); } }, done: () => uxEnd(s, done) }); };
    const nextBtn = () => uxButton({ act: 'next', ui: 'next', icon: 'next', x: 886, y: 452, r: 38, plate: 'gold' });

    const phaseStars = () => {
      const ok = mark();
      s.onKey = () => { if (ok()) phaseQuiz(); };
      setCtl(nextBtn());
      (async () => {
        const ln = uxLine('clear_' + lv.id);
        for (let k = 0; k < 3; k++) {
          await uxWait(k ? 550 : 280);
          if (!ok()) return;
          uxPopSlot(root, 's' + k);
          if (got[k]) { uxSfx('star'); uxConfetti(root.querySelector('.page'), 480 + (k - 1) * 140, 155, 12); }
        }
        await ln;
        await uxWait(650);
        if (ok()) phaseQuiz();
      })();
    };

    const phaseQuiz = () => {
      const ok = mark();
      const target = words[Math.floor(Math.random() * words.length)] || words[0];
      const validIds = new Set(WORDS.filter(w => w.kind === 'core').map(w => w.id));
      const otherLearned = Object.keys(save.words || {}).filter(id => validIds.has(id) && !words.some(w => w.id === id));
      const optIds = quizOptions(target.id, words.map(w => w.id), otherLearned, save.words, makeReviewRng(idx * 31 + 7));
      const opts = uxWordList(optIds);
      root.querySelector('#uxStars').setAttribute('transform', 'translate(480 86) scale(.55)');
      body.innerHTML = `<g transform="translate(0 40)">${uxCardRow(opts, 148, 210, 236, 26)}</g>`;
      opts.forEach((_, k) => uxPopSlot(root, k));
      setCtl(uxButton({ act: 'done', ui: 'quiz_skip', icon: 'next', x: 886, y: 452, r: 34 }));
      let tried = false, locked = false;
      uxLine('quiz_' + target.id);
      root.querySelectorAll('[data-word]').forEach(card => {
        const pick = () => {
          if (!ok() || locked) return;
          const id = card.getAttribute('data-word');
          if (id === target.id) {
            locked = true;
            noteQuizAnswer(save.words, target.id, !tried, reviewContext(save));
            saveWrite();
            uxSfx('star');
            uxConfetti(root.querySelector('.page'), 480, 260, 24);
            uxLine('quiz_right_' + (1 + Math.floor(Math.random() * 3))).then(() => {
              if (!ok()) return;
              body.innerHTML = '';
              setCtl(uxButton({ act: 'done', ui: 'next', icon: 'next', x: 585, y: 315, r: 52, plate: 'gold', cls: 'ux-pulse' }) + uxButton({ act: 'replay', ui: 'replay', icon: 'replay', x: 375, y: 315, r: 42 }));
            });
          } else {
            tried = true;
            uxSfx('wrong');
            uxNudge(card);
            uxLine('quiz_wrong_' + (1 + Math.floor(Math.random() * 3)));
          }
        };
        card.addEventListener('click', pick);
        card.addEventListener('keydown', /** @param {KeyboardEvent} e */ e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } });
      });
    };

    phaseStars();
  }

  function openParentModal() {

  /* 99-point Interactive Playgrounds: ABC Twinkle Rainbow Piano, Toddler Starlight Tracing & A<->a Case-Match Egg. */
  let traceIntroSaid = false;

  const PIANO_FILLS = ['#ffe4f0', '#e4f4ff', '#fff3cc', '#ebfae8', '#f2e8ff', '#ffeede'];
  const PIANO_RIMS = ['#f287b7', '#6dbbe8', '#efb646', '#7ec476', '#a884e6', '#f29a5e'];

  /* ---------- 1. ABC Song Twinkle Rainbow Piano Wall (Embeddable & Standalone) ---------- */
  function renderAbcPianoWall(host, s, opts) {
    const o = opts || {};
    const notesById = Object.fromEntries(ABC_SONG_NOTES.map(n => [n.id, n]));
    const wordsById = Object.fromEntries(WORDS.filter(w => w.kind === 'core').map(w => [w.id, w]));
    const rows = [0, 1, 2, 3].map(r => ABC_SONG_NOTES.filter(n => n.row === r));
    const specs = [
      { bw: 94, bh: 72, gap: 10, y: 100 },
      { bw: 78, bh: 72, gap: 8, y: 186 },
      { bw: 98, bh: 72, gap: 12, y: 272 },
      { bw: 112, bh: 72, gap: 14, y: 358 },
    ];

    let songTimer = 0;
    let mode = 'free'; // 'free' | 'auto' | 'guide'
    let guideIdx = 0;
    let autoIdx = 0;

    const pillW = o.standalone ? 440 : 410;
    const pillX = o.standalone ? 190 : 275;
    const pillHtml = `<g id="abcPreviewPill" filter="url(#softShadow)">
      <rect x="${pillX}" y="16" width="${pillW}" height="64" rx="32" fill="#13261b" opacity=".9" stroke="#ffd27a" stroke-width="3"/>
      <image id="abcPrevImg" href="${SRC('word_a')}" x="${pillX + 14}" y="22" width="52" height="52" preserveAspectRatio="xMidYMid meet" opacity="0"/>
      <text id="abcPrevTxt" x="${pillX + pillW / 2}" y="55" text-anchor="middle" font-size="22" fill="#fff7df">A – Z 彩虹字母琴键（点一点会唱歌！）</text>
    </g>`;

    const backBtn = o.standalone ? uxButton({ act: 'back', ui: 'back', icon: 'back', x: 56, y: 48, r: 34 }) : '';
    const songBtnX = o.standalone ? 772 : 760;
    const guideBtnX = o.standalone ? 862 : 850;
    const keysHtml = rows.map((rowNotes, rIdx) => {
      const sp = specs[rIdx];
      const rx0 = 480 - (rowNotes.length * sp.bw + (rowNotes.length - 1) * sp.gap) / 2;
      return rowNotes.map((n, k) => {
        const w = wordsById[n.id];
        if (!w) return '';
        const bx = rx0 + k * (sp.bw + sp.gap);
        const ci = (rIdx * 7 + k) % PIANO_FILLS.length;
        const hitR = sp.bw < 84 ? sp.bw + 6 : sp.bw;
        return `<g class="ux-btn abc-key" data-pkey="${w.id}" role="button" tabindex="0" aria-label="${w.en}" transform="translate(${bx} ${sp.y})">
          <rect x="${(sp.bw - hitR) / 2}" y="-4" width="${hitR}" height="${sp.bh + 8}" rx="18" fill="transparent"/>
          <g class="btn-vis" filter="url(#softShadow)">
            <rect class="key-bg" width="${sp.bw}" height="${sp.bh}" rx="18" fill="${PIANO_FILLS[ci]}" stroke="${PIANO_RIMS[ci]}" stroke-width="3.2"/>
            <rect x="6" y="4" width="${sp.bw - 12}" height="18" rx="9" fill="#ffffff" opacity=".52"/>
            <text class="latin" x="${sp.bw / 2 - 11}" y="44" text-anchor="middle" font-size="30" fill="#4e1f3a">${w.letter}</text>
            <text class="latin" x="${sp.bw / 2 + 16}" y="44" text-anchor="middle" font-size="22" fill="#8a4a6e">${w.lower}</text>
            <circle cx="${sp.bw / 2}" cy="60" r="3.5" fill="${PIANO_RIMS[ci]}" opacity=".75"/>
          </g>
          <rect class="guide-ring" x="-4" y="-4" width="${sp.bw + 8}" height="${sp.bh + 8}" rx="20" fill="none" stroke="#ffd27a" stroke-width="5" opacity="0" pointer-events="none"/>
        </g>`;
      }).join('');
    }).join('');

    host.innerHTML = `${pillHtml}${backBtn}
      ${uxButton({ act: 'songPlay', ui: 'abc_song', icon: 'note', x: songBtnX, y: 48, r: 34, plate: 'gold' })}
      ${uxButton({ act: 'songGuide', ui: 'hint', icon: 'sticker', x: guideBtnX, y: 48, r: 34 })}
      <g id="abcKeysLayer">${keysHtml}</g>`;

    const getKeyEl = id => host.querySelector(`[data-pkey="${id}"]`);
    const updatePreview = id => {
      const w = wordsById[id];
      const imgEl = host.querySelector('#abcPrevImg');
      const txtEl = host.querySelector('#abcPrevTxt');
      if (!w || !txtEl) return;
      if (imgEl) {
        imgEl.setAttribute('href', SRC(w.icon || 'word_' + w.id));
        imgEl.setAttribute('opacity', '1');
      }
      txtEl.setAttribute('class', 'latin');
      txtEl.setAttribute('x', String(pillX + pillW / 2 + 22));
      txtEl.setAttribute('font-size', '25');
      txtEl.setAttribute('fill', '#ffe794');
      txtEl.textContent = `${w.letter}${w.lower} · ${w.wordEn || w.en}`;
    };

    const flashKey = (id, boost) => {
      const kEl = getKeyEl(id);
      if (!kEl) return;
      kEl.classList.remove('piano-hit');
      void kEl.getBoundingClientRect();
      kEl.classList.add('piano-hit');
      const m = kEl.getAttribute('transform');
      const mm = /translate\(([-\d.]+)\s+([-\d.]+)\)/.exec(m || '');
      if (mm) {
        const cx = Number(mm[1]) + 42;
        const cy = Number(mm[2]) + 36;
        uxConfetti(host.closest('.page') || host, cx, cy, boost ? 14 : 6);
      }
    };

    const syncModeVisuals = () => {
      host.querySelectorAll('.guide-ring').forEach(r => r.setAttribute('opacity', '0'));
      host.querySelectorAll('.abc-key').forEach(k => k.classList.remove('ux-pulse'));
      const btnAuto = host.querySelector('[data-act="songPlay"]');
      const btnGuide = host.querySelector('[data-act="songGuide"]');
      if (btnAuto) btnAuto.classList.toggle('ux-pulse', mode === 'auto');
      if (btnGuide) btnGuide.classList.toggle('ux-pulse', mode === 'guide');
      if (mode === 'guide' && guideIdx < ABC_SONG_NOTES.length) {
        const tid = ABC_SONG_NOTES[guideIdx].id;
        const kEl = getKeyEl(tid);
        if (kEl) {
          kEl.classList.add('ux-pulse');
          const gr = kEl.querySelector('.guide-ring');
          if (gr) gr.setAttribute('opacity', '1');
        }
      }
    };

    const stop = () => {
      clearTimeout(songTimer);
      songTimer = 0;
      mode = 'free';
      if (typeof setPianoDuck === 'function') setPianoDuck(false);
      syncModeVisuals();
    };

    const stepAuto = () => {
      if (!uxAlive(s) || mode !== 'auto') { stop(); return; }
      if (autoIdx >= ABC_SONG_NOTES.length) {
        uxSfx('gliss');
        uxConfetti(host.closest('.page') || host, 480, 240, 36);
        stop();
        return;
      }
      const note = ABC_SONG_NOTES[autoIdx++];
      playPianoNote(note.midi, note.beats >= 2);
      updatePreview(note.id);
      const phraseEnd = note.id === 'g' || note.id === 'p' || note.id === 'v' || note.id === 'z';
      flashKey(note.id, phraseEnd);
      songTimer = setTimeout(stepAuto, Math.round(note.beats * 430));
    };

    const toggleAuto = () => {
      unlockAudio();
      uxStopVoice();
      if (mode === 'auto') { stop(); return; }
      stop();
      mode = 'auto';
      autoIdx = 0;
      if (typeof setPianoDuck === 'function') setPianoDuck(true);
      syncModeVisuals();
      stepAuto();
    };

    const toggleGuide = () => {
      unlockAudio();
      if (mode === 'guide') { stop(); return; }
      stop();
      mode = 'guide';
      guideIdx = 0;
      if (typeof setPianoDuck === 'function') setPianoDuck(true);
      syncModeVisuals();
      uxLine('abc_piano_guide', { interrupt: true, maxWait: 3000 });
    };

    host.querySelectorAll('[data-pkey]').forEach(kEl => {
      const id = kEl.getAttribute('data-pkey');
      const press = () => {
        if (!uxAlive(s)) return;
        unlockAudio();
        if (mode === 'auto') stop();
        const note = notesById[id];
        if (note) playPianoNote(note.midi, note.beats >= 2);
        updatePreview(id);
        flashKey(id, false);
        uxWordVoice(id);
        if (mode === 'guide') {
          const target = ABC_SONG_NOTES[guideIdx];
          if (target && target.id === id) {
            guideIdx++;
            if (guideIdx >= ABC_SONG_NOTES.length) {
              save.abcSongs = (save.abcSongs || 0) + 1;
              saveWrite();
              stop();
              uxSfx('gliss');
              uxConfetti(host.closest('.page') || host, 340, 220, 26);
              uxConfetti(host.closest('.page') || host, 620, 220, 26);
              uxLine('abc_piano_win', { maxWait: 4500 });
              return;
            }
            syncModeVisuals();
          } else {
            syncModeVisuals();
          }
        }
      };
      kEl.addEventListener('click', press);
      kEl.addEventListener('keydown', /** @param {KeyboardEvent} e */ e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); press(); }
      });
    });

    const bAuto = host.querySelector('[data-act="songPlay"]');
    if (bAuto) {
      bAuto.addEventListener('click', toggleAuto);
      bAuto.addEventListener('keydown', /** @param {KeyboardEvent} e */ e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleAuto(); } });
    }
    const bGuide = host.querySelector('[data-act="songGuide"]');
    if (bGuide) {
      bGuide.addEventListener('click', toggleGuide);
      bGuide.addEventListener('keydown', /** @param {KeyboardEvent} e */ e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleGuide(); } });
    }

    return { stop, toggleAuto, toggleGuide };
  }

  /* ---------- 2. Ultra-Forgiving Toddler Starlight Letter Tracing ---------- */
  function ptsToPath(pts) {
    if (!pts || !pts.length) return '';
    return pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ');
  }

  function showTrace(letterId, onDone, opts) {
    const o = opts || {};
    const core = WORDS.filter(w => w.kind === 'core');
    let curIdx = Math.max(0, core.findIndex(w => w.id === letterId));
    const s = uxScreen('trace');

    const renderLetter = () => {
      if (!uxAlive(s)) return;
      const w = core[curIdx] || core[0];
      const lid = w.id;
      const rawStrokes = LETTER_STROKES[lid] || LETTER_STROKES.a;
      const boxX = 223, boxY = 116, boxSize = 290;
      const projStrokes = rawStrokes.map(st => traceProjectStroke(st, boxX, boxY, boxSize));
      const checkpoints = projStrokes.map(st => traceSampleStroke(st, 11));
      let activeStroke = 0;
      let prog = 0;
      let finished = false;
      let drawing = false;
      const tracedCount = Object.keys(save.traced || {}).filter(k => save.traced[k]).length;

      const tracksHtml = projStrokes.map((st, idx) => {
        const d = ptsToPath(st);
        return `<path d="${d}" fill="none" stroke="#ead8b8" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="${d}" fill="none" stroke="#cbb286" stroke-width="3" stroke-dasharray="8 9" stroke-linecap="round"/>
          <g class="trace-num" data-num="${idx}" opacity="${idx === 0 ? '1' : '.42'}" transform="translate(${st[0][0].toFixed(1)} ${st[0][1].toFixed(1)})">
            <circle r="13" fill="#ff85b3" stroke="#fffaf0" stroke-width="2.5"/>
            <text class="latin" y="5" text-anchor="middle" font-size="14" fill="#ffffff">${idx + 1}</text>
          </g>`;
      }).join('');

      const navBtns = o.single
        ? uxButton({ act: 'reset', ui: 'replay', icon: 'replay', x: 682, y: 428, r: 34 }) +
          uxButton({ act: 'finishDone', ui: 'next', icon: 'next', x: 800, y: 428, r: 38, plate: 'gold' })
        : uxButton({ act: 'prevL', ui: 'back', icon: 'back', x: 640, y: 428, r: 34 }) +
          uxButton({ act: 'reset', ui: 'replay', icon: 'replay', x: 742, y: 428, r: 34 }) +
          uxButton({ act: 'nextL', ui: 'next', icon: 'next', x: 844, y: 428, r: 34, plate: 'gold' });

      const root = uxPaint(`<g class="page">
        <image href="${SRC('bg_woods')}" width="960" height="520" preserveAspectRatio="xMidYMid slice"/>
        <rect width="960" height="520" fill="#112219" opacity=".58"/>
        ${uxButton({ act: 'back', ui: 'back', icon: 'back', x: 56, y: 48, r: 34 })}
        <g filter="url(#softShadow)">
          <rect x="275" y="16" width="410" height="42" rx="21" fill="#13261b" opacity=".88" stroke="#ffd27a" stroke-width="2.5"/>
          <text id="traceBanner" x="480" y="44" text-anchor="middle" font-size="21" fill="#fff7df">跟着发光小星星写字母（${w.letter}${w.lower} · ${tracedCount}/26）</text>
        </g>

        <g id="traceBoardGroup" filter="url(#softShadow)">
          <rect x="148" y="68" width="440" height="394" rx="34" fill="#fffaf0" stroke="#e4b457" stroke-width="5"/>
          <line x1="184" y1="151" x2="552" y2="151" stroke="#f0dfbe" stroke-width="2" stroke-dasharray="8 8"/>
          <line x1="184" y1="261" x2="552" y2="261" stroke="#f5e7ca" stroke-width="2" stroke-dasharray="6 8"/>
          <line x1="184" y1="371" x2="552" y2="371" stroke="#f0dfbe" stroke-width="2.5"/>
          <g id="traceTracks">${tracksHtml}</g>
          <g id="traceDoneGroup"></g>
          <path id="traceProgPath" d="" fill="none" stroke="#ff7cb8" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
          <path id="traceProgCore" d="" fill="none" stroke="#ffd27a" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
          <g id="traceStar" transform="translate(${checkpoints[0][0][0].toFixed(1)} ${checkpoints[0][0][1].toFixed(1)})" pointer-events="none">
            <circle class="ux-ripple" r="22" fill="none" stroke="#ffd27a" stroke-width="4"/>
            <circle r="19" fill="#ffe89c" opacity=".38"/>
            <path d="${UX_STAR_D}" transform="scale(18)" fill="url(#goldGrad)" stroke="#b85a12" stroke-width=".07"/>
          </g>
          <rect id="traceHit" x="148" y="68" width="440" height="394" rx="34" fill="transparent" style="touch-action:none;cursor:crosshair"/>
        </g>

        <g id="traceMascotCard" class="ux-btn" data-word="${lid}" role="button" tabindex="0" transform="translate(624 84)">
          <g class="btn-vis" filter="url(#softShadow)">
            <rect width="236" height="278" rx="28" fill="#fffaf0" stroke="#f287b7" stroke-width="4"/>
            <rect x="52" y="14" width="132" height="44" rx="22" fill="#ffe5f1" stroke="#f287b7" stroke-width="2.5"/>
            <text class="latin" x="118" y="45" text-anchor="middle" font-size="32" fill="#b8326a">${w.letter}${w.lower}</text>
            <image href="${SRC(w.icon || 'word_' + lid)}" x="43" y="66" width="150" height="148" preserveAspectRatio="xMidYMid meet"/>
            <text class="latin" x="118" y="254" text-anchor="middle" font-size="28" fill="#2b1f09">${w.wordEn || w.en}</text>
          </g>
        </g>
        <g id="tracePrize" opacity="0" transform="translate(836 84)" pointer-events="none">
          <circle r="30" fill="#ffe4f0" stroke="#ffd27a" stroke-width="3"/>
          <image href="${SRC('hat_bow')}" x="-24" y="-20" width="48" height="40" preserveAspectRatio="xMidYMid meet"/>
        </g>
        ${navBtns}
      </g>`);

      const doneGroup = root.querySelector('#traceDoneGroup');
      const progPath = root.querySelector('#traceProgPath');
      const progCore = root.querySelector('#traceProgCore');
      const starEl = root.querySelector('#traceStar');
      const hitEl = root.querySelector('#traceHit');

      const syncStar = () => {
        if (!starEl) return;
        if (finished || activeStroke >= checkpoints.length) {
          starEl.setAttribute('opacity', '0');
          return;
        }
        const cp = checkpoints[activeStroke];
        const pt = cp[Math.min(prog, cp.length - 1)];
        starEl.setAttribute('opacity', '1');
        starEl.setAttribute('transform', `translate(${pt[0].toFixed(1)} ${pt[1].toFixed(1)})`);
        root.querySelectorAll('.trace-num').forEach(n => {
          const ni = Number(n.getAttribute('data-num'));
          n.setAttribute('opacity', ni < activeStroke ? '0' : (ni === activeStroke ? '1' : '.42'));
        });
      };

      const renderProgressPath = () => {
        const cp = checkpoints[activeStroke] || [];
        const slice = prog > 0 ? cp.slice(0, Math.min(prog, cp.length)) : [];
        const d = ptsToPath(slice);
        if (progPath) progPath.setAttribute('d', d);
        if (progCore) progCore.setAttribute('d', d);
      };

      const completeLetter = () => {
        if (finished) return;
        finished = true;
        drawing = false;
        syncStar();
        const hadCount = Object.keys(save.traced || {}).filter(k => save.traced[k]).length;
        if (!save.traced) save.traced = {};
        save.traced[lid] = true;
        saveWrite();
        const newCount = Object.keys(save.traced).filter(k => save.traced[k]).length;
        const banner = root.querySelector('#traceBanner');
        if (banner) banner.textContent = `太棒了！${w.letter}${w.lower} 描红完成（${newCount}/26）`;
        if (hadCount < 3 && newCount >= 3) {
          const pz = root.querySelector('#tracePrize');
          if (pz) pz.setAttribute('opacity', '1');
        }
        uxNudge(root.querySelector('#traceMascotCard'));
        uxSfx('gliss');
        uxConfetti(root.querySelector('.page'), 368, 250, 34);
        uxConfetti(root.querySelector('.page'), 742, 220, 22);
        const nextBtn = root.querySelector('[data-act="nextL"], [data-act="finishDone"]');
        if (nextBtn) nextBtn.classList.add('ux-pulse');
        uxWordVoice(lid);
        uxLine('trace_done_' + (1 + Math.floor(Math.random() * 2)), { maxWait: 4000 });
      };

      const stepPoint = (sx, sy) => {
        if (!uxAlive(s) || finished || activeStroke >= checkpoints.length) return;
        const cp = checkpoints[activeStroke];
        const nextProg = traceAdvance(cp, prog, sx, sy, 58);
        if (nextProg <= prog) return;
        prog = nextProg;
        playPianoNote(60 + ((prog + activeStroke * 3) % 12), false);
        const curPt = cp[Math.min(prog - 1, cp.length - 1)];
        uxConfetti(root.querySelector('.page'), curPt[0], curPt[1], 4);
        renderProgressPath();
        if (prog >= cp.length) {
          const fullD = ptsToPath(projStrokes[activeStroke]);
          if (doneGroup) {
            doneGroup.insertAdjacentHTML('beforeend',
              `<path d="${fullD}" fill="none" stroke="#ff7cb8" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
               <path d="${fullD}" fill="none" stroke="#ffd27a" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>`);
          }
          if (progPath) progPath.setAttribute('d', '');
          if (progCore) progCore.setAttribute('d', '');
          uxSfx('stone_ok');
          uxConfetti(root.querySelector('.page'), curPt[0], curPt[1], 14);
          activeStroke++;
          prog = 0;
          if (activeStroke >= checkpoints.length) {
            completeLetter();
            return;
          }
        }
        syncStar();
      };

      const toStagePt = e => {
        const svg = /** @type {SVGSVGElement} */ (/** @type {unknown} */ ($('stage')));
        const ctm = svg && svg.getScreenCTM && svg.getScreenCTM();
        if (svg && ctm && svg.createSVGPoint) {
          const pt = svg.createSVGPoint();
          pt.x = e.clientX; pt.y = e.clientY;
          return pt.matrixTransform(ctm.inverse());
        }
        return { x: e.clientX || 0, y: e.clientY || 0 };
      };

      if (hitEl) {
        hitEl.addEventListener('pointerdown', /** @param {PointerEvent} e */ e => {
          if (finished) return;
          unlockAudio();
          drawing = true;
          try { if (hitEl.setPointerCapture) hitEl.setPointerCapture(e.pointerId); } catch (_) {}
          const pt = toStagePt(e);
          stepPoint(pt.x, pt.y);
        });
        hitEl.addEventListener('pointermove', /** @param {PointerEvent} e */ e => {
          if (!drawing || finished) return;
          const pt = toStagePt(e);
          stepPoint(pt.x, pt.y);
        });
        const endDraw = () => { drawing = false; };
        hitEl.addEventListener('pointerup', endDraw);
        hitEl.addEventListener('pointercancel', endDraw);
      }

      const closeTrace = () => uxEnd(s, () => (typeof onDone === 'function' ? onDone() : showTitle()));
      s.onKey = closeTrace;
      uxBind(root, {
        back: closeTrace,
        finishDone: closeTrace,
        reset: () => { uxSfx('tap'); renderLetter(); },
        prevL: () => { curIdx = (curIdx - 1 + core.length) % core.length; uxSfx('page'); renderLetter(); uxWordVoice(core[curIdx].id); },
        nextL: () => { curIdx = (curIdx + 1) % core.length; uxSfx('page'); renderLetter(); uxWordVoice(core[curIdx].id); },
        word: card => { uxNudge(card); uxWordVoice(lid); },
      });
    };

    renderLetter();
    if (!traceIntroSaid) {
      traceIntroSaid = true;
      uxLine('trace_intro', { maxWait: 4000 });
    } else {
      uxWordVoice(letterId);
    }
  }

  /* ---------- 3. A <-> a Uppercase/Lowercase Hand-in-Hand Match ---------- */
  function showCaseMatch(onDone) {
    const core = WORDS.filter(w => w.kind === 'core');
    const learned = core.filter(w => save.words[w.id] && (save.words[w.id].heard > 0 || save.words[w.id].seen));
    const seedIds = ['a', 'b', 'd', 'e', 'g', 'h', 'm', 'n', 'q', 'r'];
    const pool = [...learned];
    for (const id of seedIds) {
      const obj = core.find(w => w.id === id);
      if (obj && !pool.some(x => x.id === id)) pool.push(obj);
    }
    const shuffled = pool.slice().sort(() => Math.random() - .5).slice(0, 4);
    const s = uxScreen('caseMatch');
    let roundIdx = 0;

    const renderRound = () => {
      if (!uxAlive(s)) return;
      if (roundIdx >= shuffled.length) {
        save.caseMatches = (save.caseMatches || 0) + 1;
        saveWrite();
        const root = uxPaint(`<g class="page">
          <image href="${SRC('bg_meadow')}" width="960" height="520" preserveAspectRatio="xMidYMid slice"/>
          <rect width="960" height="520" fill="#112219" opacity=".52"/>
          <rect x="230" y="96" width="500" height="260" rx="34" fill="#fffaf0" stroke="#ffd27a" stroke-width="5" filter="url(#softShadow)"/>
          <image href="${SRC('hat_butterfly')}" x="415" y="114" width="130" height="114" preserveAspectRatio="xMidYMid meet" class="ux-anim-pulse"/>
          <text x="480" y="274" text-anchor="middle" font-size="30" fill="#b8326a">大小写全部牵手成功！</text>
          <text x="480" y="316" text-anchor="middle" font-size="20" fill="#3b5e46">装扮间蝴蝶发箍彩蛋已解锁（已完成 ${save.caseMatches} 次）</text>
          ${uxButton({ act: 'again', ui: 'replay', icon: 'replay', x: 392, y: 426, r: 38 })}
          ${uxButton({ act: 'back', ui: 'next', icon: 'home', x: 568, y: 426, r: 42, plate: 'gold', cls: 'ux-pulse' })}
        </g>`);
        const finish = () => uxEnd(s, () => (typeof onDone === 'function' ? onDone() : showTitle()));
        s.onKey = finish;
        uxBind(root, { again: () => showCaseMatch(onDone), back: finish });
        uxSfx('gliss');
        uxConfetti(root.querySelector('.page'), 340, 200, 28);
        uxConfetti(root.querySelector('.page'), 620, 200, 28);
        uxLine('match_done', { maxWait: 4500 });
        return;
      }

      const target = shuffled[roundIdx];
      const distractors = core.filter(w => w.id !== target.id).sort(() => Math.random() - .5).slice(0, 2);
      const choices = [target, ...distractors].sort(() => Math.random() - .5);
      let assist = false;
      let locked = false;

      const palette = [['#ffe5f1', '#f287b7'], ['#e4f4ff', '#6dbbe8'], ['#fff3cc', '#efb646']];
      const xs = [250, 480, 710];
      const dots = shuffled.map((_, i) => `<circle cx="${480 + (i - 1.5) * 28}" cy="38" r="${i < roundIdx ? 7 : (i === roundIdx ? 9 : 6)}" fill="${i <= roundIdx ? '#ffd27a' : '#587863'}" stroke="#fff7e6" stroke-width="2"/>`).join('');

      const choiceHtml = choices.map((c, idx) => {
        const [bgCol, rimCol] = palette[idx % palette.length];
        return `<g class="stone-btn" data-pick="${c.id}" role="button" tabindex="0" aria-label="${c.lower}" transform="translate(${xs[idx]} 398)">
          <rect x="-80" y="-56" width="160" height="112" rx="28" fill="transparent"/>
          <rect class="match-assist" x="-80" y="-56" width="160" height="112" rx="28" fill="none" stroke="#ffd27a" stroke-width="5" opacity="0"/>
          <g class="stone-vis" filter="url(#softShadow)">
            <rect x="-74" y="-50" width="148" height="100" rx="24" fill="${bgCol}" stroke="${rimCol}" stroke-width="4.5"/>

      }).join('');

      const root = uxPaint(`<g class="page">
        <image href="${SRC('bg_meadow')}" width="960" height="520" preserveAspectRatio="xMidYMid slice"/>
        <rect width="960" height="520" fill="#112219" opacity=".48"/>
        ${uxButton({ act: 'back', ui: 'back', icon: 'back', x: 56, y: 48, r: 34 })}
        ${dots}
        <g class="ux-btn" data-word="${target.id}" role="button" tabindex="0" transform="translate(200 94)">
          <g class="btn-vis" filter="url(#softShadow)">
            <rect width="196" height="196" rx="28" fill="#fffaf0" stroke="#f287b7" stroke-width="4.5"/>
            <text class="latin" x="98" y="114" text-anchor="middle" font-size="88" fill="#b8326a">${target.letter}</text>

        <image id="matchHeart" href="${SRC('fx_heart')}" x="454" y="166" width="52" height="52" opacity=".45" preserveAspectRatio="xMidYMid meet"/>

      s.onKey = back;
      uxBind(root, { back, word: el => { uxNudge(el); uxWordVoice(target.id); } });
      if (roundIdx === 0) uxLine('match_intro', { maxWait: 4000 });
      else uxWordVoice(target.id);

      root.querySelectorAll('[data-pick]').forEach(btn => {
        const pid = btn.getAttribute('data-pick');
        const pick = () => {
          if (!uxAlive(s) || locked) return;
          unlockAudio();
          if (pid === target.id) {
            locked = true;
            const heart = root.querySelector('#matchHeart');
            const tBg = root.querySelector('#matchTargetBg');
            const tTxt = root.querySelector('#matchTargetTxt');
            if (heart) { heart.setAttribute('opacity', '1'); heart.setAttribute('class', 'ux-anim-pulse'); }
            if (tBg) { tBg.removeAttribute('stroke-dasharray'); tBg.setAttribute('fill', '#fff3cc'); tBg.setAttribute('fill-opacity', '1'); tBg.setAttribute('stroke', '#f287b7'); }
            if (tTxt) { tTxt.setAttribute('fill', '#4e1f3a'); tTxt.textContent = target.lower; }
            uxSfx('blend');
            uxConfetti(root.querySelector('.page'), 480, 192, 26);
            uxWordVoice(target.id);
            setTimeout(() => {
              if (!uxAlive(s)) return;
              roundIdx++;
              renderRound();

          } else {

        btn.addEventListener('keydown', /** @param {KeyboardEvent} e */ e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } });
      });
    };

    renderRound();
  }

      if (!uxAlive(s)) return;
      const allTray = core.filter(w => unlocked.has(w.id));

    uxLine('me_labrador');
  }

  /* ---------- Pup Gear Locker / Wardrobe (3 Outfits + 5 Hats including Girl Bow & Butterfly Headband) ---------- */
  function showWardrobe(fromMeet) {
    const s = uxScreen('wardrobe');
    const stars = totalStarsCount();
    const tracedCount = Object.keys(save.traced || {}).filter(k => save.traced[k]).length;
    const hatRows = [[null, 'bow', 'wreath'], ['butterfly', 'detective', 'crown']];
    const hatHint = { bow: '★3/✎3', wreath: '★8', butterfly: 'Aa/★10', detective: '★12', crown: '★16' };
    const isHatOpen = h => {
      if (!h) return true;
      if (h === 'bow') return stars >= WARDROBE_UNLOCKS.bow || tracedCount >= 3;
      if (h === 'butterfly') return stars >= WARDROBE_UNLOCKS.butterfly || (save.caseMatches || 0) >= 1;
      return stars >= WARDROBE_UNLOCKS[h];
    };
    loadArt(['hat_bow', 'hat_wreath', 'hat_butterfly', 'hat_detective', 'hat_crown'], 1200);

    const render = () => {
      if (!uxAlive(s)) return;
      const oS = save.outfit.skye, oL = save.outfit.labrador;
      const dressBtns = (who, cx) => [0, 1, 2].map((d, k) => {
        const need = d === 0 ? 0 : (d === 1 ? WARDROBE_UNLOCKS.d1 : WARDROBE_UNLOCKS.d2);
        const open = stars >= need, active = save.outfit[who].dress === d;
        const cols = who === 'skye' ? ['#ff7cb8', '#5ecbff', '#a48bff'] : ['#2e4c85', '#34945e', '#c94b5b'];
        return `<g class="ux-btn" data-who="${who}" data-kind="dress" data-val="${d}" data-state="${open ? (active ? 'on' : 'open') : 'lock'}" role="button" tabindex="${open ? 0 : -1}" transform="translate(${cx + (k - 1) * 78} 314)">
          <g class="btn-vis" filter="url(#softShadow)">
            <circle r="31" fill="#fffaf0" stroke="${active ? '#ffd27a' : '#8cb67d'}" stroke-width="${active ? 5 : 2.5}"/>
            <circle r="20" fill="${cols[d]}" opacity="${open ? 1 : .28}"/>
          </g>
        </g>`;
      }).join('');
      const hatBtns = (who, cx) => hatRows.map((row, rIdx) => row.map((h, k) => {
        const open = isHatOpen(h), active = save.outfit[who].hat === h;
        const x = cx + (k - 1) * 78, y = 388 + rIdx * 74;
        const inner = h && SIZES['hat_' + h]
          ? `<image href="${SRC('hat_' + h)}" x="-22" y="-22" width="44" height="44" preserveAspectRatio="xMidYMid meet" opacity="${open ? 1 : .28}"/>`
          : `<text class="latin" y="8" text-anchor="middle" font-size="24" fill="#6b7f70">✕</text>`;
        const lockTag = h && !open ? `<text y="24" text-anchor="middle" font-size="11" fill="#5e7a67">${hatHint[h] || ''}</text>` : '';
        return `<g class="ux-btn" data-who="${who}" data-kind="hat" data-val="${h || ''}" data-state="${open ? (active ? 'on' : 'open') : 'lock'}" role="button" tabindex="${open ? 0 : -1}" transform="translate(${x} ${y})">
          <g class="btn-vis" filter="url(#softShadow)">
            <circle r="31" fill="#fffaf0" stroke="${active ? '#ffd27a' : '#8cb67d'}" stroke-width="${active ? 5 : 2.5}"/>${inner}${lockTag}
          </g>
        </g>`;
      }).join('')).join('');

      const root = uxPaint(`<g class="page">
        <image href="${SRC('bg_woods')}" width="960" height="520" preserveAspectRatio="xMidYMid slice"/>
        <rect width="960" height="520" fill="#112219" opacity=".6"/>
        <rect x="115" y="44" width="320" height="226" rx="28" fill="#fbe8f1" stroke="#ffd27a" stroke-width="4" filter="url(#softShadow)"/>
        <rect x="525" y="44" width="320" height="226" rx="28" fill="#e6efe4" stroke="#ffd27a" stroke-width="4" filter="url(#softShadow)"/>
        <g id="wdSkye" transform="translate(275 248) scale(1.38)"></g>
        <g id="wdLab" transform="translate(685 254) scale(1.24)"></g>
        ${dressBtns('skye', 275)}${hatBtns('skye', 275)}
        ${dressBtns('labrador', 685)}${hatBtns('labrador', 685)}
        ${uxButton({ act: 'back', ui: 'back', icon: 'back', x: 56, y: 48, r: 34 })}
      </g>`);

      if (typeof renderPupNode === 'function') {
        renderPupNode(root.querySelector('#wdSkye'), 'skye', 'cheer', oS);
        renderPupNode(root.querySelector('#wdLab'), 'labrador', 'cheer', oL);
      }

      const back = () => { saveWrite(); uxEnd(s, () => (fromMeet ? showMeet() : showTitle())); };
      s.onKey = back;
      uxBind(root, { back });
      root.querySelectorAll('[data-who]').forEach(btn => {
        if (btn.getAttribute('data-state') === 'lock') return;
        const pick = () => {
          const who = btn.getAttribute('data-who'), kind = btn.getAttribute('data-kind'), val = btn.getAttribute('data-val');
          if (kind === 'dress') save.outfit[who].dress = Number(val);
          else save.outfit[who].hat = val || null;
          saveWrite(); uxSfx('star'); uxLine('cheer_' + (1 + Math.floor(Math.random() * 2)));
          render();
        };
        btn.addEventListener('click', pick);
        btn.addEventListener('keydown', /** @param {KeyboardEvent} e */ e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } });
      });
    };
    render();
  }
  /* Stage resizing (Retina hdFit), portrait pause check, pointer parallax, keyboard navigation & gamepad gold focus ring. */
  const inputView = { panX: 0, targetPan: 0, fsTipAt: 0 };
  let fitRaf = 0;

  const isPortraitView = () => window.matchMedia('(orientation: portrait)').matches && window.matchMedia('(pointer: coarse)').matches;

  function applyFit() {
    fitRaf = 0;
    const availW = window.innerWidth, availH = window.innerHeight;
    const cssW = layoutStageWidth(availW, availH);
    const stage = $('stage');
    if (stage) {
      stage.style.width = cssW + 'px';
      stage.style.height = layoutStageHeight(cssW) + 'px';
      hdFit(cssW);
    }
    if (typeof refreshAudioGains === 'function') refreshAudioGains();
    if (isPortraitView() && typeof voice !== 'undefined') voice.suspend();
  }

  function fitStageSoon() { if (!fitRaf) fitRaf = requestAnimationFrame(applyFit); }
  window.addEventListener('resize', fitStageSoon);
  window.addEventListener('orientationchange', fitStageSoon);
  applyFit();

  function toggleFullscreen() {
    const doc = document, elRoot = document.documentElement;
    const active = doc.fullscreenElement || doc.webkitFullscreenElement;
    if (active) {
      if (doc.exitFullscreen) doc.exitFullscreen().catch(() => {});
      else if (doc.webkitExitFullscreen) doc.webkitExitFullscreen();
    } else {
      if (elRoot.requestFullscreen) elRoot.requestFullscreen().catch(() => {});
      else if (elRoot.webkitRequestFullscreen) elRoot.webkitRequestFullscreen();
    }
  }

  $('stage').addEventListener('pointermove', e => {
    const r = $('stage').getBoundingClientRect();
    if (r.width > 0) inputView.targetPan = Math.max(-1, Math.min(1, ((e.clientX - r.left) / r.width - .5) * 2));
  });

  window.addEventListener('keydown', e => {
    if (uxState.modal) return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'ArrowDown') {
      const dir = e.key === 'ArrowRight' ? 'r' : e.key === 'ArrowLeft' ? 'l' : e.key === 'ArrowDown' ? 'd' : 'u';
      if (movePadFocus(dir)) e.preventDefault();
    } else if (e.key === 'Enter' || e.key === ' ') {
      const active = document.activeElement;
      if (active && $('stage').contains(active) && active instanceof HTMLElement) return;
      if (story && story.onKey) { e.preventDefault(); story.onKey(); }
    } else if (e.key === 'Escape' && story && story.name !== 'title' && story.name !== 'finale') {
      const back = $('overlay').querySelector('[data-act="back"]');
      if (back) back.dispatchEvent(new MouseEvent('click'));
    }
  });

  /* Gamepad & keyboard focus ring navigation over visible clickable stage elements */
  let padCur = -1, padLastMove = 0, padLastA = false, padLastB = false;

  function interactiveTargets() {
    const scope = uxState.modal ? $('modal') : storyIsOpen() ? $('overlay') : $('hotspots').children.length ? $('hotspots') : $('workshop');
    if (!scope) return [];
    const nodes = [...scope.querySelectorAll('[role="button"]:not([data-state="lock"]), .stone-btn, .hotspot')];
    return nodes.map(node => {
      const b = node.getBoundingClientRect();
      const s = $('stage').getBoundingClientRect();
      const k = s.width > 0 ? 960 / s.width : 1;
      return {
        node,
        pulse: node.classList.contains('ux-pulse'),
        x: (b.left - s.left) * k, y: (b.top - s.top) * k,
        w: b.width * k, h: b.height * k,
      };
    }).filter(r => r.w > 10 && r.h > 10);
  }

  function showPadRing(r) {
    const pf = $('padFocus');
    if (!pf) return;
    if (!r) { pf.setAttribute('visibility', 'hidden'); return; }
    const rect = pf.querySelector('rect');
    rect.setAttribute('x', (r.x - 4).toFixed(1)); rect.setAttribute('y', (r.y - 4).toFixed(1));
    rect.setAttribute('width', (r.w + 8).toFixed(1)); rect.setAttribute('height', (r.h + 8).toFixed(1));
    pf.setAttribute('visibility', 'visible');
  }

  function movePadFocus(dir) {
    const list = interactiveTargets();
    if (!list.length) { showPadRing(null); return false; }
    if (padCur < 0 || padCur >= list.length) {
      padCur = layoutPadStart(list);
      showPadRing(list[padCur]);
      return true;
    }
    const next = layoutPadPick(dir, padCur, list);
    if (next >= 0) {
      padCur = next;
      showPadRing(list[padCur]);
      list[padCur].node.dispatchEvent(new Event('focus'));
      return true;
    }
    return false;
  }

  function padTick(now) {
    const pads = navigator.getGamepads ? navigator.getGamepads() : null;
    const p = pads && pads[0];
    if (!p) { if (!document.activeElement || document.activeElement === document.body) showPadRing(null); return; }
    const ax = p.axes[0] || 0, ay = p.axes[1] || 0;
    const l = (p.buttons[14] && p.buttons[14].pressed) || ax < -.5;
    const r = (p.buttons[15] && p.buttons[15].pressed) || ax > .5;
    const u = (p.buttons[12] && p.buttons[12].pressed) || ay < -.5;
    const d = (p.buttons[13] && p.buttons[13].pressed) || ay > .5;
    if ((l || r || u || d) && now - padLastMove > .22) {
      padLastMove = now;
      movePadFocus(r ? 'r' : l ? 'l' : d ? 'd' : 'u');
    }
    const aPressed = !!(p.buttons[0] && p.buttons[0].pressed);
    if (aPressed && !padLastA) {
      const list = interactiveTargets();
      if (padCur >= 0 && list[padCur]) list[padCur].node.dispatchEvent(new MouseEvent('click'));
    }
    padLastA = aPressed;
    const bPressed = !!(p.buttons[1] && p.buttons[1].pressed);
    if (bPressed && !padLastB) {
      const back = $('overlay').querySelector('[data-act="back"]');
      if (back) back.dispatchEvent(new MouseEvent('click'));
    }
    padLastB = bPressed;
  }
  /* Orchestration: main game flow, Scene A / Scene B interactive handlers, animation loop, dev QA hooks & offline worker. */
  const playFlow = { phase: 'title', prevIdx: null, workshopQueued: false, wsLock: false, wsNonce: 0, wsAdvanceTimer: 0 };
  const uxHooksReady = () => { uxHooks.replay = i => openRoom(i, true); };
  uxHooksReady();

  function registerOfflineWorker() {
    if (!offlineWorkerAllowed(location.search, location.protocol, 'serviceWorker' in navigator)) return;
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  function onSettingChanged(key, value) {
    if (key === 'sound') { muted = !value; if (typeof refreshAudioGains === 'function') refreshAudioGains(); }
    if (key === 'subtitles' && typeof TK !== 'undefined') TK.refreshSubtitles();
  }

  function roomArtSet(idx, extraWords) {
    const lv = LEVELS[idx];
    if (!lv) return [];
    return roomArt(lv, LINES, { wear: save.outfit, extraWords: extraWords || [], last: idx === LEVELS.length - 1 });
  }

  function onStartJourney() {
    const idx = nextRoomIndex();
    const go = () => openRoom(idx);
    if (!save.flags.prologue && idx === 0) {
      loadArt(assetPlan(LEVELS, LINES, { wear: save.outfit }).prologue, ART_PATIENCE).then(() => {
        save.flags.prologue = true; saveWrite();
        showStory(['p1', 'p2', 'p3'], go);
      });
    } else go();
  }

  function openRoom(idx, skipRecall) {
    const lv = LEVELS[idx];
    if (!lv) return;
    const prevIdx = playFlow.prevIdx;
    const prevLv = !skipRecall && prevIdx != null && prevIdx !== idx ? LEVELS[prevIdx] : null;
    const recallIds = prevLv ? recallWordsFor(prevLv.words, save.words, reviewContext(save)) : [];
    const needArt = roomArtSet(idx, recallIds);
    playFlow.phase = 'story';
    playFlow.workshopQueued = false;
    playFlow.wsNonce++;
    playFlow.wsLock = false;
    clearTimeout(playFlow.wsAdvanceTimer);
    playFlow.wsAdvanceTimer = 0;

    loadArt(needArt, ART_PATIENCE).then(() => {
      const startPlay = () => {
        reviewAdvanceClock(save); saveWrite();
        playFlow.phase = 'play';
        game.start(idx);
        sceneDrawn.idx = -1;
        renderStage(game, true);
        syncHud();
        talkOnEvents(game.drain(), game);
      };
      const showCard = () => showChapter(idx, startPlay);
      if (recallIds.length) showRecall(prevLv, showCard, recallIds);
      else showCard();
    });
  }

  function onHudReplay() {
    if (game.state !== 'play') return;
    playFlow.workshopQueued = false;
    playFlow.wsNonce++;
    playFlow.wsLock = false;
    clearTimeout(playFlow.wsAdvanceTimer);
    playFlow.wsAdvanceTimer = 0;
    game.start(game.index);
    sceneDrawn.idx = -1;
    renderStage(game, true);
    syncHud();
    talkOnEvents(game.drain(), game);
  }

  function onHotspotClick(id) {
    if (!canPlay() || game.screen !== 0) return;
    unlockAudio();
    const h = game.hotspots.find(x => x.id === id);
    if (!h || h.opened) return;
    const prevReady = game.workshopReady;
    if (!game.tapHotspot(id)) return;
    if (h.kind === 'word') spawnOrbArc(h.x, h.y, 130, 45);
    uxConfetti($('fx'), h.x, h.y, h.kind === 'word' ? 16 : 12);
    renderStage(game, false);
    const evs = game.drain();
    audioOnEvents(evs, game);
    talkOnEvents(evs, game);
    if (!prevReady && game.workshopReady && game.screen === 0 && !playFlow.workshopQueued) {
      playFlow.workshopQueued = true;
      setTimeout(() => {
        if (game.state === 'play' && game.screen === 0 && !storyIsOpen()) onEnterWorkshop();
      }, 2600);
    }
  }

  function onEnterWorkshop() {
    if (!canPlay() || game.screen !== 0) return;
    unlockAudio();
    if (!game.enterWorkshop(false)) return;
    uxSfx('page');
    renderStage(game, false);
    const evs = game.drain();
    audioOnEvents(evs, game);
    talkOnEvents(evs, game);
  }

  function onWorkshopPromptReplay() {
    if (!canPlay() || game.screen !== 1) return;
    unlockAudio();
    const r = game.currentRound();
    if (r) TK.say('quiz_' + r.word, { interrupt: true, tag: 'prompt', maxWait: 4000 });
  }

  let lastHoverStone = { chunk: '', t: 0 };
  function onStoneHover(chunk) {
    if (!canPlay() || game.screen !== 1) return;
    const now = performance.now();
    if (chunk === lastHoverStone.chunk && now - lastHoverStone.t < 450) return;
    lastHoverStone = { chunk, t: now };
    if (hasLineKey('ph_' + chunk)) voice.line('ph_' + chunk, { interrupt: true, priority: 0, tag: 'ui', maxWait: 500, subtitle: false });
  }

  function onStoneClick(chunk, btnNode) {
    if (!canPlay() || game.screen !== 1 || playFlow.wsLock) return;
    unlockAudio();
    const ok = game.tapStone(chunk);
    const evs = game.drain();
    audioOnEvents(evs, game);
    talkOnEvents(evs, game);
    if (!ok) {
      uxNudge(btnNode);
      renderStage(game, false);
      return;
    }
    const blended = evs.find(e => e.type === 'word_blended');
    if (!blended) {
      renderStage(game, false);
      return;
    }

    playFlow.wsLock = true;
    const nonce = ++playFlow.wsNonce;
    clearTimeout(playFlow.wsAdvanceTimer);
    playFlow.wsAdvanceTimer = 0;
    let pausedForTrace = false;

    const advanceWorkshop = () => {
      if (nonce !== playFlow.wsNonce || game.state === 'title' || playFlow.phase !== 'play') return;
      clearTimeout(playFlow.wsAdvanceTimer);
      playFlow.wsAdvanceTimer = 0;
      playFlow.wsLock = false;
      if (game.state === 'clear' || game.state === 'win') {
        completeRoom(game.index);
        return;
      }
      if (game.state === 'play') {
        renderStage(game, false);
        const nr = game.currentRound();
        if (nr) TK.say('quiz_' + nr.word, { tag: 'prompt', maxWait: 4500 });
      }
    };

    if (typeof revealWorkshopMascot === 'function') {
      revealWorkshopMascot(blended.word, {
        onTrace: typeof showTrace === 'function'
          ? () => {
              if (nonce !== playFlow.wsNonce) return;
              pausedForTrace = true;
              clearTimeout(playFlow.wsAdvanceTimer);
              playFlow.wsAdvanceTimer = 0;
              showTrace(blended.word, () => {
                if (nonce !== playFlow.wsNonce || game.state === 'title') return;
                syncHud();
                advanceWorkshop();
              }, { single: true });
            }
          : null,
        onNext: () => advanceWorkshop(),
      });
    }

    uxConfetti($('fx'), 480, 212, 38);
    setTimeout(() => {
      if ($('fx')) { uxConfetti($('fx'), 370, 165, 18); uxConfetti($('fx'), 590, 165, 18); }
    }, 220);

    const blendDone = TK.say('blend_' + blended.word, { interrupt: true, tag: 'blend', maxWait: 6000 });
    Promise.all([uxWait(2200), Promise.race([blendDone, uxWait(9000)])]).then(() => {
      if (pausedForTrace || nonce !== playFlow.wsNonce || game.state === 'title' || storyIsOpen()) return;
      playFlow.wsAdvanceTimer = setTimeout(() => {
        if (!pausedForTrace && !storyIsOpen()) advanceWorkshop();
      }, 450);
    });
  }

  function onPupTap(who) {
    if (!canPlay()) return;
    unlockAudio();
    game.cheerFriend(who);
    const pt = who === 'skye' ? game.skye : game.labrador;
    uxConfetti($('fx'), pt.x, pt.y - 45, 14);
    const evs = game.drain();
    audioOnEvents(evs, game);
    talkOnEvents(evs, game);
  }

  function openMemoryOverlay(memId) {
    showMemory(game.level(), memId, () => {
      playFlow.phase = 'play';
      syncHud();
    });
  }

  function triggerHint() {
    if (!canPlay()) return;
    unlockAudio();
    game.idleTime = 12;
    game.hintTarget = game.computeHintTarget();
    uxSfx('tap');
    voice.line('idle_' + (1 + Math.floor(Math.random() * 4)), { interrupt: true, tag: 'hint', maxWait: 3000 });
  }

  function completeRoom(lvIdx) {
    const lv = LEVELS[lvIdx];
    playFlow.phase = 'clear';
    playFlow.prevIdx = lvIdx;
    const acornsAll = !game.acorns || game.acorns.total === 0 ? true : game.acorns.got >= game.acorns.total;
    markRoom(lv.id, { cleared: true, memory: !!game.memoryFound, stars: [true, !!game.memoryFound, acornsAll] });
    for (const wid of lv.words) if (!save.stickers.includes(wid)) save.stickers.push(wid);
    saveWrite();

    showClear(lvIdx, () => {
      if (lvIdx >= LEVELS.length - 1) {
        const endPlan = assetPlan(LEVELS, LINES, { wear: save.outfit });
        loadArt(endPlan.ending, ART_PATIENCE).then(() => showStory(['win', 'end'], () => showFinale(showTitle)));
      } else {
        openRoom(lvIdx + 1);
      }
    });
  }

  /* Main loop */
  let lastT = performance.now(), secAcc = 0;
  function frame(now) {
    const dt = Math.min(.05, (now - lastT) / 1000);
    lastT = now;
    const tSec = now / 1000;
    inputView.panX += (inputView.targetPan - inputView.panX) * Math.min(1, dt * 6);
    if (canPlay()) {
      game.step(dt);
      const evs = game.drain();
      if (evs.length) { audioOnEvents(evs, game); talkOnEvents(evs, game); }
      renderPups(game, tSec);
      secAcc += dt;
      if (secAcc >= 1) { save.totalPlaySeconds += Math.floor(secAcc); secAcc %= 1; saveSoon(); }
    }
    updateAmbientMotion(tSec, inputView.panX);
    fxTick(dt, tSec, game);
    audioTick();
    padTick(tSec);
    requestAnimationFrame(frame);
  }

  /* Boot sequence: preload title set (< 2.5 MB), render Title (or DEV ?dev=1&qa=...) */
  const titlePlan = assetPlan(LEVELS, LINES, { wear: save.outfit });
  const qaMode = DEV ? new URLSearchParams(location.search).get('qa') : null;
  if (DEV && qaMode === 'unlock') {
    save.unlocked.rooms = LEVELS.length;
    for (const lv of LEVELS) markRoom(lv.id, { cleared: true, memory: true, stars: [true, true, true] });
    for (const w of WORDS) if (w.kind === 'core' && !save.stickers.includes(w.id)) save.stickers.push(w.id);
    save.outfit.skye = { dress: 1, hat: 'wreath' };
    save.outfit.labrador = { dress: 1, hat: 'detective' };
  }

  loadArt(titlePlan.title, ART_PATIENCE).then(() => {
    registerOfflineWorker();
    if (DEV && qaMode === 'win') {
      save.unlocked.rooms = LEVELS.length;
      for (const lv of LEVELS) markRoom(lv.id, { cleared: true, memory: true, stars: [true, true, true] });
      for (const w of WORDS) {
        if (w.kind !== 'core') continue;
        if (!save.stickers.includes(w.id)) save.stickers.push(w.id);
        save.words[w.id] = { heard: 8, quiz: 1, seen: true };
      }
      save.outfit.skye = { dress: 1, hat: 'crown' };
      save.outfit.labrador = { dress: 2, hat: 'detective' };
      loadArt(titlePlan.ending, ART_PATIENCE).then(() => showStory(['win', 'end'], () => showFinale(showTitle)));
    } else {
      showTitle();
    }
    requestAnimationFrame(frame);
  });
})();
</script>
</body>
