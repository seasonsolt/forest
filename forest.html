<style>

  @font-face { font-family: 'Fredoka'; src: url("game/font_en.woff2?v=1fd50823ae6a") format('woff2'); font-weight: 500 700; font-display: swap; }
  :root { --night: #112219; --forest: #1c3526; --gold: #ffd27a; --cream: #fff7e6; }
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--night); color: var(--cream); overflow: hidden;
    font-family: "ZCOOL KuaiLe", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  }
  svg#stage {
    width: min(98vw, 180vh); max-height: 98vh; height: auto; display: block; border-radius: 18px;
    box-shadow: 0 22px 64px rgba(0, 0, 0, .65); background: var(--forest); touch-action: manipulation;
  }
  svg#stage text { font-family: "ZCOOL KuaiLe", "PingFang SC", sans-serif; }
  svg#stage .latin { font-family: "Fredoka", "Nunito", "Arial Rounded MT Bold", sans-serif; font-weight: 700; }

  @keyframes moteDrift { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(12px, -14px) scale(1.18); } }
  .mote { animation: moteDrift 10s ease-in-out infinite; }
  @keyframes flicker { 0%, 100% { opacity: .6; } 50% { opacity: .95; } }
  .flicker { animation: flicker 4s ease-in-out infinite; }
  @keyframes bobSlow { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  .bobSlow { animation: bobSlow 3s ease-in-out infinite; }
  @keyframes rippleRing { 0% { transform: scale(.85); opacity: .78; } 100% { transform: scale(1.9); opacity: 0; } }
  .ux-ripple { animation: rippleRing 1.3s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes petalFall {
    0% { transform: translateY(-30px) rotate(0deg); opacity: 0; }
    12% { opacity: .92; }
    85% { opacity: .88; }
    100% { transform: translateY(550px) rotate(320deg); opacity: 0; }
  }
  .fin-petal { animation: petalFall 5.6s linear infinite; }

  .ux-btn { cursor: pointer; }
  .ux-btn .btn-vis { transition: transform .16s ease, filter .16s ease; }
  .ux-btn:hover .btn-vis, .ux-btn:focus-visible .btn-vis { transform: scale(1.06); filter: drop-shadow(0 0 12px rgba(255, 224, 150, .85)); }
  .ux-btn:active .btn-vis { transform: scale(.94); }
  .ux-btn:focus-visible { outline: none; }
  .ux-btn.is-hold .btn-vis { filter: drop-shadow(0 0 14px rgba(154, 240, 178, .9)); }
  .ux-btn[data-state="lock"] { cursor: default; }
  .ux-btn[data-state="lock"]:hover .btn-vis { transform: none; filter: none; }

  .hotspot { cursor: pointer; transition: transform .18s ease; }
  .hotspot:hover { filter: drop-shadow(0 0 10px rgba(255, 236, 155, .9)); }
  .stone-btn { cursor: pointer; }
  .stone-btn:hover .stone-vis, .stone-btn:focus-visible .stone-vis { transform: scale(1.07); filter: drop-shadow(0 0 14px rgba(255, 218, 122, .95)); }
  .stone-btn:active .stone-vis { transform: scale(.93); }
  .stone-btn:focus-visible { outline: none; }

  @keyframes uxShake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }
  .ux-shake { animation: uxShake .32s ease-out; }
  @keyframes uxPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.09); } }
  .ux-pulse > .btn-vis, .ux-pulse > .stone-vis, .ux-anim-pulse { animation: uxPulse 1.3s ease-in-out infinite; }
  @keyframes uxPop { 0% { opacity: 0; transform: scale(.45); } 65% { transform: scale(1.08); } 100% { opacity: 1; transform: scale(1); } }
  .ux-pop { opacity: 0; transform: scale(.45); }
  .ux-pop.on { opacity: 1; transform: scale(1); animation: uxPop .42s cubic-bezier(.2, .9, .3, 1.3) both; }
  @keyframes pageIn { from { opacity: 0; } to { opacity: 1; } }
  .page { animation: pageIn .35s ease; }

  #padFocus rect { fill: none; stroke: #ffd27a; stroke-width: 5; opacity: .95; }
  #modal { pointer-events: auto; }
  #modal input, #modal select { font: inherit; }

  #turn {
    display: none; position: fixed; inset: 0; z-index: 20; background: var(--night);
    align-items: center; justify-content: center;
  }
  #turn svg { width: min(55vw, 55vh); height: auto; }
  @keyframes turnHint { 0%, 25% { transform: rotate(0deg); } 65%, 100% { transform: rotate(-90deg); } }
  #turn .tablet { transform-origin: 120px 120px; animation: turnHint 2.6s ease-in-out infinite; }
  @media (orientation: portrait) {
    #turn { display: flex; }
    svg#stage { visibility: hidden; }
  }
</style>

/* Pure game state machine for 天天和警长的森林探案 (<script id="logic">). Zero DOM access; runs in Node tests and browser. */
const STAGE_W = 960;
const STAGE_H = 520;
const IDLE_HINT_SEC = 12;

function createGame() {
  const g = {
    state: 'title',   // 'title' | 'play' | 'clear' | 'win'
    index: 0,
    screen: 0,        // 0 = Scene A (Clue Hunt), 1 = Scene B (Sound Workshop)
    time: 0,
    idleTime: 0,
    hintTarget: null,
    workshopReady: false,
    memoryFound: false,
    hotspots: [],
    orbs: { got: 0, total: 3, words: [] },
    acorns: { got: 0, total: 2 },
    stars: { got: 0, total: 2 },   // alias matching shared HUD/review conventions
    skye: { x: 165, y: 150, tx: 165, ty: 150, facing: 1, cheer: 0 },
    labrador: { x: 120, y: 405, tx: 120, ty: 405, facing: 1, cheer: 0 },
    workshop: null,
    events: [],

    level() {
      return LEVELS[g.index];
    },

    emit(ev) {
      g.events.push(ev);
    },

    drain() {
      return g.events.splice(0, g.events.length);
    },

    load(i) {
      const idx = Math.max(0, Math.min(LEVELS.length - 1, i | 0));
      const lv = LEVELS[idx];
      g.index = idx;
      g.screen = 0;
      g.time = 0;
      g.idleTime = 0;
      g.hintTarget = null;
      g.workshopReady = false;
      g.memoryFound = false;
      g.hotspots = lv.sceneA.map(h => Object.assign({}, h, { opened: false }));
      g.orbs = { got: 0, total: lv.words.length, words: [] };
      g.acorns = { got: 0, total: lv.sceneA.filter(h => h.kind === 'acorn').length };
      g.stars = { got: 0, total: g.acorns.total };
      g.skye = { x: 145, y: 148, tx: 145, ty: 148, facing: 1, cheer: 0 };
      g.labrador = { x: 92, y: 416, tx: 92, ty: 416, facing: 1, cheer: 0 };
      g.workshop = {
        mode: lv.mode,
        rounds: lv.rounds.map(r => ({
          word: r.word,
          onset: r.onset,
          rime: r.rime,
          onsets: r.onsets.slice(),
          rimes: r.rimes.slice(),
        })),
        roundIdx: 0,
        step: 'onset',
        pickedOnset: '',
        pickedRime: lv.mode === 'onset' ? lv.rounds[0].rime : '',
        misses: 0,
        assistGlow: false,
        solved: lv.rounds.map(() => false),
      };
      g.events = [];
      g.emit({ type: 'load', index: idx, id: lv.id });
    },

    start(i) {
      g.load(i);
      g.state = 'play';
    },

    currentRound() {
      const w = g.workshop;
      return w && w.rounds[w.roundIdx] ? w.rounds[w.roundIdx] : null;
    },

    currentChoices() {
      const r = g.currentRound();
      if (!r || !g.workshop) return [];
      return g.workshop.step === 'rime' ? r.rimes : r.onsets;
    },

    resetIdle() {
      g.idleTime = 0;
      g.hintTarget = null;
    },

    computeHintTarget() {
      if (g.state !== 'play') return null;
      if (g.screen === 0) {
        if (g.workshopReady) return { screen: 0, kind: 'workshop' };
        const nextWord = g.hotspots.find(h => !h.opened && h.kind === 'word');
        if (nextWord) return { screen: 0, kind: 'hotspot', id: nextWord.id };
        const nextAny = g.hotspots.find(h => !h.opened);
        return nextAny ? { screen: 0, kind: 'hotspot', id: nextAny.id } : null;
      }
      const w = g.workshop, r = g.currentRound();
      if (!w || !r) return null;
      const val = w.step === 'rime' ? r.rime : r.onset;
      return { screen: 1, kind: 'stone', part: w.step, val };
    },

    tapHotspot(id) {
      if (g.state !== 'play' || g.screen !== 0) return false;
      const h = g.hotspots.find(x => x.id === id);
      if (!h || h.opened) return false;
      h.opened = true;
      g.resetIdle();
      g.skye.tx = Math.max(80, Math.min(STAGE_W - 80, h.x));
      g.skye.ty = Math.max(95, Math.min(STAGE_H - 95, h.y - 36));
      g.skye.facing = g.skye.tx >= g.skye.x ? 1 : -1;
      g.skye.cheer = 1.1;
      g.labrador.facing = h.x >= g.labrador.x ? 1 : -1;
      g.labrador.cheer = 0.8;

      if (h.kind === 'word') {
        g.orbs.got++;
        if (h.word && !g.orbs.words.includes(h.word)) g.orbs.words.push(h.word);
        g.emit({ type: 'clue', id: h.id, kind: 'word', word: h.word, x: h.x, y: h.y, got: g.orbs.got, total: g.orbs.total });
      } else if (h.kind === 'memory') {
        g.memoryFound = true;
        g.emit({ type: 'memory', id: h.id, x: h.x, y: h.y, memoryId: g.level().memoryId });
      } else {
        g.acorns.got++;
        g.stars.got = g.acorns.got;
        g.emit({ type: 'acorn', id: h.id, x: h.x, y: h.y, got: g.acorns.got, total: g.acorns.total });
      }

      if (g.orbs.got >= g.orbs.total && !g.workshopReady) {
        g.workshopReady = true;
        g.emit({ type: 'workshop_ready', screen: 0 });
      }
      if (g.hotspots.every(x => x.opened)) g.enterWorkshop(true);
      return true;
    },

    enterWorkshop(auto) {
      if (g.state !== 'play' || g.screen !== 0 || g.orbs.got < g.orbs.total) return false;
      g.screen = 1;
      g.resetIdle();
      g.skye.tx = 175; g.skye.ty = 215; g.skye.facing = 1;
      g.labrador.tx = 100; g.labrador.ty = 408; g.labrador.facing = 1;
      g.emit({ type: 'screen2', auto: !!auto, mode: g.level().mode });
      return true;
    },

    tapStone(choice) {
      if (g.state !== 'play' || g.screen !== 1 || !g.workshop) return false;
      const w = g.workshop, r = g.currentRound();
      if (!r || w.step === 'done') return false;
      const val = typeof choice === 'number' ? g.currentChoices()[choice] : String(choice || '');
      if (!val) return false;
      g.resetIdle();

      const expected = w.step === 'rime' ? r.rime : r.onset;
      if (val !== expected) {
        w.misses++;
        if (w.misses >= 2) {
          w.assistGlow = true;
          g.emit({ type: 'stone_assist', part: w.step, target: expected, word: r.word });
        }
        g.emit({ type: 'stone_try', part: w.step, val, expected, misses: w.misses });
        return false;
      }

      if (w.step === 'onset') {
        w.pickedOnset = val;
        if (w.mode === 'blend') {
          w.step = 'rime';
          w.misses = 0;
          w.assistGlow = false;
          g.skye.cheer = 0.7;
          g.emit({ type: 'stone_ok', part: 'onset', val, word: r.word, roundIdx: w.roundIdx });
          return true;
        }
        w.pickedRime = r.rime;
      } else {
        w.pickedRime = val;
      }

      w.step = 'done';
      w.misses = 0;
      w.assistGlow = false;
      w.solved[w.roundIdx] = true;
      g.skye.cheer = 1.4;
      g.labrador.cheer = 1.2;
      g.emit({ type: 'word_blended', word: r.word, onset: r.onset, rime: r.rime, roundIdx: w.roundIdx });

      const nextIdx = w.roundIdx + 1;
      if (nextIdx >= w.rounds.length) {
        const lastRoom = g.index >= LEVELS.length - 1;
        g.state = lastRoom ? 'win' : 'clear';
        g.emit({ type: lastRoom ? 'win' : 'clear', index: g.index, id: g.level().id });
      } else {
        w.roundIdx = nextIdx;
        w.step = 'onset';
        w.pickedOnset = '';
        w.pickedRime = w.mode === 'onset' ? w.rounds[nextIdx].rime : '';
      }
      return true;
    },

    cheerFriend(who) {
      if (who === 'skye') { g.skye.cheer = 1.0; g.emit({ type: 'cheer', who: 'skye' }); return true; }
      if (who === 'labrador') { g.labrador.cheer = 1.0; g.emit({ type: 'cheer', who: 'labrador' }); return true; }
      return false;
    },

    step(dt) {
      if (g.state !== 'play') return;
      const clamped = Math.min(0.05, Math.max(0, dt || 0));
      g.time += clamped;
      g.idleTime += clamped;
      for (const ch of [g.skye, g.labrador]) {
        const k = Math.min(1, clamped * 8);
        ch.x += (ch.tx - ch.x) * k;
        ch.y += (ch.ty - ch.y) * k;
        if (ch.cheer > 0) ch.cheer = Math.max(0, ch.cheer - clamped);
      }
      if (!g.hintTarget && g.idleTime >= IDLE_HINT_SEC) {
        g.hintTarget = g.computeHintTarget();
        if (g.hintTarget) g.emit({ type: 'hint_auto', target: g.hintTarget });
      }
    },
  };
  return g;
}

    { key: 69, tempo: .45, arp: [0, 4, 7, 12, 11, 7], bass: [0, 7, 5, 4], mel: [16, 19, 21, 19, 16, 14, 12, 16] },
    { key: 60, tempo: .43, arp: [0, 7, 12, 16, 12, 7], bass: [0, 5, 9, 7], mel: [14, 16, 19, 24, 21, 19, 16, 14] },
    { key: 65, tempo: .39, arp: [0, 4, 7, 12, 16, 12], bass: [0, 7, 5, 7], mel: [12, 16, 19, 24, 19, 16, 14, 12] },
  ];

  let nextBeat = 0, stepN = 0;
  function audioTick() {
    if (!audio || !bus || !soundWanted()) return;
    if (audio.state !== 'running') return;
    const now = audio.currentTime;
    if (nextBeat < now - .5) nextBeat = now + .05;
    const th = THEMES[curLevel % THEMES.length];
    while (nextBeat < now + .22) {
      const m = th.key + th.arp[stepN % th.arp.length];
      envNote(nextBeat, midi(m), th.tempo * 1.4, .055, 'triangle', bus.music);
      if (stepN % 3 === 0) {
        const b = th.key - 12 + th.bass[(stepN / 3) % th.bass.length | 0];
        envNote(nextBeat, midi(b), th.tempo * 2.4, .06, 'sine', bus.music);
      }
      if (stepN % 2 === 0) {
        const fm = th.key + 12 + th.mel[((stepN / 2) | 0) % th.mel.length];
        envNote(nextBeat, midi(fm), th.tempo * 1.8, .035, 'sine', bus.music);
      }
      stepN++;
      nextBeat += th.tempo;
    }
  }

  function audioOnEvents(events, g) {
    for (const e of events || []) {
      if (e.type === 'load') { curLevel = e.index || 0; stepN = 0; }
      else if (e.type === 'clue') uxSfx(game.level().bg === 'bg_pond' ? 'splash' : 'clue');
      else if (e.type === 'memory' || e.type === 'acorn') uxSfx('star');
      else if (e.type === 'stone_ok') uxSfx('stone_ok');
      else if (e.type === 'word_blended') uxSfx('blend');
      else if (e.type === 'stone_try') uxSfx('wrong');
      else if (e.type === 'cheer') uxSfx('cheer');
    }
  }
  /* Spoken bilingual guidance, subtitle bubbles (only when setting('subtitles') is on), and word exposure logging. */
  const TK = (() => {
    const isDev = () => { try { return /[?&]dev=1(&|$)/.test(location.search); } catch (e) { return false; } };
    const subtitlesOn = () => { try { return !!setting('subtitles'); } catch (e) { return false; } };
    const hasLine = key => !!(typeof LINES === 'object' && LINES && LINES.lines && LINES.lines[key]);
    let curSub = null, introDone = -1;

    function countWordHeard(id) {
      try { if (typeof noteWordHeard === 'function') noteWordHeard(id); } catch (e) {}
    }
    function wordStats() {
      const out = {};
      for (const id of Object.keys(heardLog)) out[id] = Object.assign({}, heardLog[id]);
      return out;
    }

    function hideBubble() {
      const t = $('talk');
      if (t) t.textContent = '';
    }

    function renderBubble(sub) {
      const t = $('talk');
      if (!t) return;
      t.textContent = '';
      if (!sub || !subtitlesOn() || !sub.segments || !sub.segments.length) return;
      const text = sub.segments.map(s => s.text).join(' ');
      const lines = wrap(text, 22).slice(0, 3);
      const w = Math.min(720, Math.max(220, Math.max(...lines.map(l => l.length)) * 20 + 44));
      const h = lines.length * 26 + 22;
      const g = el('g', { transform: `translate(${480 - w / 2} 446)` }, t);
      el('rect', { width: w, height: h, rx: 16, fill: '#112219', opacity: '.88', stroke: sub.who === 'labrador' ? '#7bb6ff' : '#ff9cc4', 'stroke-width': 2.5 }, g);
      lines.forEach((ln, i) => {
        const tx = el('text', { x: w / 2, y: 27 + i * 26, 'text-anchor': 'middle', 'font-size': 18, fill: '#fff8ea' }, g);
        tx.textContent = ln;
      });
    }

    if (typeof voice !== 'undefined' && typeof voice.onSubtitle === 'function') {
      voice.onSubtitle(sub => { curSub = sub; renderBubble(sub); });
    }

    function refreshSubtitles() { renderBubble(curSub); }

    function say(key, opts) {
      if (!hasLine(key)) return Promise.resolve(false);
      return voice.line(key, opts);
    }

    function talkOnEvents(events, g) {
      g = g || game;
      for (const e of events || []) {
        if (e.type === 'load') {
          introDone = -1;
          hideBubble();
          if (isDev()) window.__wordStats = wordStats;
        } else if (e.type === 'clue' && e.word) {
          voice.word(e.word);
          say('spot_' + e.word, { tag: 'spot', maxWait: 4500 });
        } else if (e.type === 'memory') {
          if (typeof openMemoryOverlay === 'function') openMemoryOverlay(e.memoryId);
        } else if (e.type === 'acorn') {
          say('clue_' + (1 + (e.got % 4)), { tag: 'clue', maxWait: 3000 });
        } else if (e.type === 'workshop_ready') {
          say('screen2_' + g.level().mode, { tag: 'ws', maxWait: 5000 });
        } else if (e.type === 'screen2') {
          if (!save.flags.tutorial) {
            save.flags.tutorial = true; saveSoon();
            say('tutor_phonics', { tag: 'tutor', maxWait: 5000 });
          } else {
            say('screen2_' + g.level().mode, { tag: 'ws', maxWait: 5000 });
          }
        } else if (e.type === 'word_blended') {
          voice.word(e.word);
          say('blend_' + e.word, { tag: 'blend', maxWait: 5000 });
        } else if (e.type === 'stone_assist') {
          say('stone_assist', { interrupt: true, tag: 'assist', maxWait: 4000 });
        } else if (e.type === 'stone_try') {
          say('stone_try_' + (1 + ((e.misses || 1) % 3)), { interrupt: true, tag: 'try', maxWait: 2500 });
        } else if (e.type === 'cheer') {
          say('cheer_' + (1 + Math.floor(Math.random() * 4)), { interrupt: true, tag: 'cheer', maxWait: 2000 });
        } else if (e.type === 'hint_auto') {
          say('idle_' + (1 + Math.floor(Math.random() * 4)), { tag: 'hint', maxWait: 3500 });
        }
      }
      if (g.state === 'play' && introDone !== g.index && !storyIsOpen()) {
        introDone = g.index;
        say('case_' + g.level().id, { tag: 'case', maxWait: 5000 });
        if (g.index === 0 && !save.flags.tapTip) {
          save.flags.tapTip = true; saveSoon();
          say('tutor_tap', { tag: 'tutor', maxWait: 5000 });
        }
      }
    }

    return { countWordHeard, talkOnEvents, refreshSubtitles, wordStats, say, hasLine };
  })();

  const countWordHeard = TK.countWordHeard;
  const talkOnEvents = TK.talkOnEvents;
  const wordStats = TK.wordStats;
  /* Storybooks, Chapter Card (跟我说 ripple), Recall, Clear Quiz, Memory Postcard, and Grand Finale Keepsake Album. */
  let story = null;
  let storyDraws = 0;
  const storyIsOpen = () => !!story;
  const uxHooks = { replay: /** @type {(i: number) => void} */ (() => {}), back: () => {} };

  const UX_STAR_D = 'M0 -.8L.22 -.25L.8 -.22L.35 .15L.5 .72L0 .4L-.5 .72L-.35 .15L-.8 -.22L-.22 -.25Z';

  function uxLevel(v) { return typeof v === 'number' ? LEVELS[v] : v; }
  function uxLevelIndex(lv) { return LEVELS.indexOf(lv); }
  function uxRoomWords(lv) { return (lv && lv.words ? lv.words : []).map(id => WORDS.find(w => w.id === id)).filter(Boolean); }
  function uxWordList(ids) { return (ids || []).map(id => typeof id === 'string' ? WORDS.find(w => w.id === id) : id).filter(Boolean); }

  function uxKey(prefix, id) { return prefix + '_' + id; }
  function uxLine(key, opts) { return hasLineKey(key) ? voice.line(key, opts) : Promise.resolve(false); }
  function uxLineArt(key, fallback) { const L = lineOf(key); return (L && L.art) || fallback; }
  function uxPreload(keys) { if (typeof voice !== 'undefined' && voice.preload) voice.preload(keys); }
  function uxStopVoice() { if (typeof voice !== 'undefined' && voice.stop) voice.stop(); }
  function uxWordVoice(id) { if (typeof voice !== 'undefined' && voice.word) voice.word(id); }
  function uxWait(ms) { return new Promise(ok => setTimeout(ok, ms)); }
  function uxSaveNow() { saveWrite(); }
  function uxNoteReviewed(id) { noteReviewed(save.words, id, reviewContext(save)); saveWrite(); }

  function uxScreen(name) {
    story = { name, seq: 0, onKey: null };
    return story;
  }
  const uxAlive = s => story === s;
  function uxEnd(s, done) {
    if (story !== s) return;
    story = null;
    $('overlay').textContent = '';
    uxStopVoice();
    if (typeof done === 'function') done();
  }

  function uxPaint(html) {
    const root = $('overlay');
    root.innerHTML = html;
    return root;
  }

  function uxPic(name, x, y, w, h, fallback, fit) {
    if (SIZES[name]) return `<image href="${SRC(name)}" x="${x}" y="${y}" width="${w}" height="${h}" preserveAspectRatio="xMidYMid ${fit || 'slice'}"/>`;
    return fallback || '';
  }

  function uxIcon(kind, r, col) {
    const s = r || 20, c = col || '#fff7e6';
    if (kind === 'next') return `<path d="M${-s * .35} ${-s * .4}L${s * .4} 0L${-s * .35} ${s * .4}Z" fill="${c}"/>`;
    if (kind === 'back') return `<path d="M${s * .35} ${-s * .4}L${-s * .4} 0L${s * .35} ${s * .4}Z" fill="${c}"/>`;
    if (kind === 'home') return `<path d="M0 ${-s * .55}L${s * .58} ${-s * .05}V${s * .55}H${s * .18}V${s * .12}H${-s * .18}V${s * .55}H${-s * .58}V${-s * .05}Z" fill="none" stroke="${c}" stroke-width="3" stroke-linejoin="round"/>`;
    if (kind === 'replay') return `<path d="M${s * .45} ${-s * .15}A${s * .48} ${s * .48} 0 1 0 ${s * .35} ${s * .32}" fill="none" stroke="${c}" stroke-width="3.4" stroke-linecap="round"/><path d="M${s * .25} ${-s * .35}L${s * .52} ${-s * .08}L${s * .18} ${s * .04}Z" fill="${c}"/>`;
    if (kind === 'play') return `<path d="M${-s * .28} ${-s * .45}L${s * .52} 0L${-s * .28} ${s * .45}Z" fill="${c}"/>`;
    if (kind === 'book') return `<rect x="${-s * .55}" y="${-s * .45}" width="${s * 1.1}" height="${s * .9}" rx="4" fill="none" stroke="${c}" stroke-width="2.6"/><line x1="0" y1="${-s * .45}" x2="0" y2="${s * .45}" stroke="${c}" stroke-width="2.2"/>`;
    if (kind === 'sticker') return `<path d="${UX_STAR_D}" transform="scale(${s * .68})" fill="${c}"/>`;
    if (kind === 'wardrobe') return `<path d="M0 ${-s * .5}L${s * .45} ${-s * .1}L${s * .3} ${s * .55}H${-s * .3}L${-s * .45} ${-s * .1}Z" fill="none" stroke="${c}" stroke-width="2.6" stroke-linejoin="round"/>`;
    if (kind === 'rooms') return `<rect x="${-s * .5}" y="${-s * .5}" width="${s * .42}" height="${s * .42}" rx="4" fill="${c}"/><rect x="${s * .08}" y="${-s * .5}" width="${s * .42}" height="${s * .42}" rx="4" fill="${c}"/><rect x="${-s * .5}" y="${s * .08}" width="${s * .42}" height="${s * .42}" rx="4" fill="${c}"/><rect x="${s * .08}" y="${s * .08}" width="${s * .42}" height="${s * .42}" rx="4" fill="${c}"/>`;
    if (kind === 'gear') return `<circle r="${s * .42}" fill="none" stroke="${c}" stroke-width="3.2" stroke-dasharray="5 3"/><circle r="${s * .16}" fill="${c}"/>`;
    return `<circle r="${s * .35}" fill="${c}"/>`;
  }

  function uxButton(o) {
    const r = Math.max(32, o.r || 36);
    const hitR = layoutHitRadius(r, !!o.ring);
    const fill = o.plate === 'gold' ? 'url(#goldGrad)' : 'url(#plateGrad)';
    const stroke = o.plate === 'gold' ? '#fff7dc' : '#80a875';
    const icCol = o.plate === 'gold' ? '#4a2605' : '#1b3824';
    const cls = 'ux-btn' + (o.cls ? ' ' + o.cls : '');
    const pic = o.pic ? uxPic(o.pic, -r * .78, -r * .78, r * 1.56, r * 1.56) : uxIcon(o.icon || o.ui, r * .65, icCol);
    return `<g class="${cls}" data-act="${o.act}" data-ui="${o.ui || o.act}" role="button" tabindex="0" aria-label="${o.ui || o.act}" transform="translate(${o.x} ${o.y})">
      <circle r="${hitR}" fill="transparent"/><g class="btn-vis" filter="url(#softShadow)">
      <circle r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="3.5"/>${pic}</g></g>`;
  }

  function uxNudge(node) {
    if (!node) return;
    node.classList.remove('ux-shake');
    void node.getBoundingClientRect();
    node.classList.add('ux-shake');
  }

  function uxPopSlot(root, k) {
    const n = root.querySelector(`[data-pop="${k}"]`);
    if (n) n.classList.add('on');
  }

  function uxBind(root, handlers) {
    if (!root) return;
    root.querySelectorAll('[data-act]').forEach(btn => {
      const act = btn.getAttribute('data-act'), ui = btn.getAttribute('data-ui');
      btn.addEventListener('pointerenter', () => { if (ui && typeof voice !== 'undefined') voice.ui(ui); });
      btn.addEventListener('focus', () => { if (ui && typeof voice !== 'undefined') voice.ui(ui); });
      btn.addEventListener('click', () => { if (handlers[act]) handlers[act](btn); });
      btn.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (handlers[act]) handlers[act](btn); } });
    });
    if (handlers.word) {
      root.querySelectorAll('[data-word]').forEach(card => {
        const go = () => handlers.word(card);
        card.addEventListener('click', go);
        card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
      });
    }
  }

  function uxCardRow(words, y, cw, ch, gap) {
    const n = words.length, x0 = 480 - (n * cw + (n - 1) * gap) / 2;
    return words.map((w, i) => {
      const x = x0 + i * (cw + gap), pad = Math.round(cw * .12);
      const imgH = ch - 56;
      return `<g class="ux-pop" data-pop="${i}"><g class="ux-btn" data-word="${w.id}" role="button" tabindex="0" aria-label="${w.en}" transform="translate(${x} ${y})">
        <g class="btn-vis" filter="url(#softShadow)">
        <rect width="${cw}" height="${ch}" rx="22" fill="#fffaf0" stroke="#e4b457" stroke-width="3.5"/>
        ${uxPic(w.icon || 'word_' + w.id, pad, 14, cw - pad * 2, imgH, '', 'meet')}
        <text class="latin" x="${cw / 2}" y="${ch - 14}" text-anchor="middle" font-size="${cw > 180 ? 32 : 26}" fill="#2b1f09">${w.en}</text>
      </g></g></g>`;
    }).join('');
  }

  /* ---------- story sequence (prologue / finale story) ---------- */
  function showStory(keys, done) {
    const s = uxScreen('story');
    storyDraws++;
    uxPreload(keys);
    let idx = 0;
    const render = () => {
      if (!uxAlive(s)) return;
      const key = keys[idx], art = uxLineArt(key, 'story_open');
      const root = uxPaint(`<g class="page">
        <image href="${SRC(art)}" width="960" height="520" preserveAspectRatio="xMidYMid slice"/>
        <rect width="960" height="520" fill="url(#bottomFade)" opacity=".45" pointer-events="none"/>
        <g transform="translate(480 492)">${keys.map((_, k) => `<circle cx="${(k - (keys.length - 1) / 2) * 20}" cy="0" r="${k === idx ? 6 : 4.5}" fill="${k === idx ? '#ffd27a' : '#b7d4c0'}"/>`).join('')}</g>
        ${uxButton({ act: 'next', ui: 'next', icon: 'next', x: 886, y: 452, r: 38, plate: 'gold' })}
      </g>`);
      const next = () => {
        if (!uxAlive(s)) return;
        uxStopVoice();
        if (++idx < keys.length) render();
        else uxEnd(s, done);
      };
      s.onKey = next;
      uxBind(root, { next });
      uxLine(key).then(() => {
        if (!uxAlive(s)) return;
        const b = root.querySelector('[data-act="next"]');
        if (b) b.classList.add('ux-pulse');
      });
    };
    render();
  }

  /* ---------- chapter card with "跟我说" sound-wave ripple & confetti ---------- */
  function showChapter(level, done) {
    const lv = uxLevel(level), words = uxRoomWords(lv), s = uxScreen('chapter');
    uxPreload([uxKey('ch', lv.id), ...words.map(w => uxKey('learn', w.id))]);
    const n = words.length, cw = 216, ch = 250, gap = 28, x0 = 480 - (n * cw + (n - 1) * gap) / 2;
    const root = uxPaint(`<g class="page">
      <image href="${SRC(uxLineArt('ch_' + lv.id, lv.bg))}" width="960" height="520" preserveAspectRatio="xMidYMid slice"/>
      <rect width="960" height="520" fill="#112219" opacity=".52"/>
      ${uxCardRow(words, 118, cw, ch, gap)}
      <g id="uxCue" opacity="0" transform="translate(480 68)" pointer-events="none">
        <circle class="ux-ripple" r="24" fill="none" stroke="#ffd27a" stroke-width="4"/>
        <circle r="22" fill="#ffd27a" opacity=".25"/>
      </g>
      ${uxButton({ act: 'go', ui: 'next', icon: 'next', x: 886, y: 452, r: 38, plate: 'gold' })}
    </g>`);
    const finish = () => uxEnd(s, done);
    s.onKey = finish;
    uxBind(root, { go: finish, word: el => { uxNudge(el); uxWordVoice(el.dataset.word); } });
    const cue = root.querySelector('#uxCue');
    const setCue = k => {
      if (k == null) { cue.setAttribute('opacity', '0'); return; }
      cue.setAttribute('transform', `translate(${x0 + k * (cw + gap) + cw / 2} 92)`);
      cue.setAttribute('opacity', '1');
    };
    (async () => {
      await uxLine('ch_' + lv.id);
      for (let k = 0; k < n; k++) {
        if (!uxAlive(s)) return;
        uxPopSlot(root, k); uxSfx('page'); setCue(k);
        await uxLine('learn_' + words[k].id);
        if (!uxAlive(s)) return;
        await uxWait(1200);
        if (!uxAlive(s)) return;
        uxSfx('star');
        uxConfetti(root.querySelector('.page'), x0 + k * (cw + gap) + cw / 2, 110, 10);
        setCue(null);
        await uxWait(220);
      }
      if (!uxAlive(s)) return;
      const b = root.querySelector('[data-act="go"]');
      if (b) b.classList.add('ux-pulse');
    })();
  }

  /* ---------- spaced recall before entering the next room ---------- */
  function showRecall(prevLevel, done, ids) {
    const lv = prevLevel == null ? null : uxLevel(prevLevel), own = lv ? lv.words || [] : [];
    const words = uxWordList(Array.isArray(ids) ? ids : own);
    if (!lv || !words.length) { if (done) done(); return; }
    const s = uxScreen('recall');
    const older = recallOlderIds(own, words.map(w => w.id));
    uxPreload(words.map(w => uxKey('recall', w.id)));
    const wide = words.length > 3;
    const root = uxPaint(`<g class="page">
      <image href="${SRC(lv.bg)}" width="960" height="520" preserveAspectRatio="xMidYMid slice"/>
      <rect width="960" height="520" fill="#112219" opacity=".54"/>
      ${wide ? uxCardRow(words, 145, 160, 196, 16) : uxCardRow(words, 130, 210, 240, 28)}
      ${uxButton({ act: 'skip', ui: 'next', icon: 'next', x: 886, y: 452, r: 36, plate: 'gold' })}
    </g>`);
    const finish = () => uxEnd(s, done);
    s.onKey = finish;
    uxBind(root, { skip: finish, word: el => { uxNudge(el); uxWordVoice(el.dataset.word); } });
    (async () => {
      for (let k = 0; k < words.length; k++) {
        if (!uxAlive(s)) return;
        uxPopSlot(root, k); uxSfx('page');
        await uxLine('recall_' + words[k].id);
        if (!uxAlive(s)) return;
        if (older.includes(words[k].id)) uxNoteReviewed(words[k].id);
        await uxWait(180);
      }
      await uxWait(450);
      finish();
    })();
  }

  /* ---------- memory postcard popup ---------- */
  function showMemory(level, id, done) {
    const lv = uxLevel(level), s = uxScreen('memory');
    const root = uxPaint(`<g class="page">
      <rect width="960" height="520" fill="#112219" opacity=".72"/>
      <g transform="translate(480 240)" filter="url(#softShadow)">
        <rect x="-250" y="-155" width="500" height="310" rx="28" fill="#fffaf0" stroke="#ffd27a" stroke-width="5"/>
        ${uxPic(uxLineArt('mem_' + id, lv.bg), -230, -135, 460, 250)}
        ${uxPic('prop_postcard', 165, -130, 68, 68)}
      </g>
      ${uxButton({ act: 'ok', ui: 'next', icon: 'next', x: 480, y: 446, r: 38, plate: 'gold', cls: 'ux-pulse' })}
    </g>`);
    const ok = () => uxEnd(s, done);
    s.onKey = ok;
    uxBind(root, { ok });
    uxSfx('star');
    uxConfetti(root.querySelector('.page'), 480, 200, 20);
    uxLine('mem_' + id);
  }

  /* ---------- clear page: 3 stars -> word cards -> listening quiz ---------- */
  function showClear(level, done) {
    const lv = uxLevel(level), idx = uxLevelIndex(lv), words = uxRoomWords(lv), s = uxScreen('clear');
    const memory = !!game.memoryFound, acorns = !game.acorns || game.acorns.total === 0 ? true : game.acorns.got >= game.acorns.total;
    const got = [true, memory, acorns];
    s.seq = 0;

    const starsHtml = got.map((g, k) => `<g transform="translate(${(k - 1) * 140} 0)"><g class="ux-pop" data-pop="s${k}">
      ${g ? '<circle r="60" fill="#fff2b5" opacity=".32"/>' : ''}
      <path d="${UX_STAR_D}" transform="scale(56)" fill="${g ? 'url(#goldGrad)' : '#1d3627'}" stroke="${g ? '#fff5cf' : '#588267'}" stroke-width=".06" opacity="${g ? 1 : .85}"/>
    </g></g>`).join('');

    uxPaint(`<g class="page">
      <image href="${SRC(lv.bg)}" width="960" height="520" preserveAspectRatio="xMidYMid slice"/>
      <rect width="960" height="520" fill="#112219" opacity=".58"/>
      <g id="uxStars" transform="translate(480 155)">${starsHtml}</g>
      <g id="uxBody"></g><g id="uxCtl"></g>
    </g>`);
    const root = $('overlay'), body = root.querySelector('#uxBody'), ctl = root.querySelector('#uxCtl');
    const mark = () => { const me = ++s.seq; return () => uxAlive(s) && s.seq === me; };
    const setCtl = html => { ctl.innerHTML = html; uxBind(ctl, { next: () => s.onKey && s.onKey(), replay: () => { if (uxAlive(s)) { uxEnd(s, null); uxHooks.replay(idx); } }, done: () => uxEnd(s, done) }); };
    const nextBtn = () => uxButton({ act: 'next', ui: 'next', icon: 'next', x: 886, y: 452, r: 38, plate: 'gold' });

    const phaseStars = () => {
      const ok = mark();
      s.onKey = () => { if (ok()) phaseQuiz(); };
      setCtl(nextBtn());
      (async () => {
        const ln = uxLine('clear_' + lv.id);
        for (let k = 0; k < 3; k++) {
          await uxWait(k ? 550 : 280);

          uxPopSlot(root, 's' + k);

        }

        await uxWait(650);
        if (ok()) phaseQuiz();
      })();
    };

    const phaseQuiz = () => {
      const ok = mark();
      const target = words[Math.floor(Math.random() * words.length)] || words[0];
      const otherLearned = Object.keys(save.words || {}).filter(id => !words.some(w => w.id === id));
      const optIds = quizOptions(target.id, words.map(w => w.id), otherLearned, save.words, makeReviewRng(idx * 31 + 7));

      root.querySelector('#uxStars').setAttribute('transform', 'translate(480 86) scale(.55)');

      setCtl(uxButton({ act: 'done', ui: 'quiz_skip', icon: 'next', x: 886, y: 452, r: 34 }));
      let tried = false, locked = false;
      uxLine('quiz_' + target.id);
      root.querySelectorAll('[data-word]').forEach(card => {
        const pick = () => {
          if (!ok() || locked) return;
          const id = card.getAttribute('data-word');
          if (id === target.id) {
            locked = true;
            noteQuizAnswer(save.words, target.id, !tried, reviewContext(save));
            saveWrite();
            uxSfx('star');
            uxConfetti(root.querySelector('.page'), 480, 260, 24);
            uxLine('quiz_right_' + (1 + Math.floor(Math.random() * 3))).then(() => {
              if (!ok()) return;
              body.innerHTML = '';
              setCtl(uxButton({ act: 'done', ui: 'next', icon: 'next', x: 585, y: 315, r: 52, plate: 'gold', cls: 'ux-pulse' }) + uxButton({ act: 'replay', ui: 'replay', icon: 'replay', x: 375, y: 315, r: 42 }));
            });
          } else {
            tried = true;
            uxSfx('wrong');
            uxNudge(card);
            uxLine('quiz_wrong_' + (1 + Math.floor(Math.random() * 3)));
          }
        };
        card.addEventListener('click', pick);
        card.addEventListener('keydown', /** @param {KeyboardEvent} e */ e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } });
      });
    };

    phaseStars();
  }

        render();
      };
      root.querySelectorAll('[data-st]').forEach((btn, idx) => {
        const wid = btn.getAttribute('data-st');
        const choose = () => {
          selected = wid;
          uxWordVoice(wid);
          placeAt(wid, 220 + (idx % 6) * 104, idx < 6 ? 155 : 265);
        };
        btn.addEventListener('click', choose);
        btn.addEventListener('keydown', /** @param {KeyboardEvent} e */ e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); choose(); } });
      });
      if (board) {
        board.addEventListener('click', /** @param {MouseEvent} e */ e => {
          if (!selected) return;
          const svg = /** @type {SVGSVGElement} */ (/** @type {unknown} */ ($('stage')));
          const pt = svg.createSVGPoint();
          pt.x = e.clientX; pt.y = e.clientY;
          const loc = pt.matrixTransform(svg.getScreenCTM().inverse());
          placeAt(selected, Math.round(loc.x), Math.round(loc.y));
        });
      }
    };
    render();
  }

  /* ---------- Meet Skye & Sheriff Labrador ---------- */
  function showMeet() {
    const s = uxScreen('meet');
    const root = uxPaint(`<g class="page">
      <image href="${SRC('bg_woods')}" width="960" height="520" preserveAspectRatio="xMidYMid slice"/>
      <rect width="960" height="520" fill="#112219" opacity=".5"/>
      <g class="ux-btn" data-hero="skye" role="button" tabindex="0" transform="translate(310 340) scale(1.35)">
        <circle cx="0" cy="-70" r="90" fill="url(#rose)"/>
        <g id="meetSkye"></g>
      </g>
      <g class="ux-btn" data-hero="labrador" role="button" tabindex="0" transform="translate(650 340) scale(1.22)">
        <circle cx="0" cy="-80" r="95" fill="url(#cool)"/>
        <g id="meetLab"></g>
      </g>
      ${uxButton({ act: 'back', ui: 'back', icon: 'back', x: 56, y: 48, r: 34 })}
      ${uxButton({ act: 'wardrobe', ui: 'wardrobe', icon: 'wardrobe', x: 480, y: 446, r: 42, plate: 'gold', cls: 'ux-pulse' })}
    </g>`);
    if (typeof renderPupNode === 'function') {
      renderPupNode(root.querySelector('#meetSkye'), 'skye', 'idle', save.outfit.skye);
      renderPupNode(root.querySelector('#meetLab'), 'labrador', 'idle', save.outfit.labrador);
    }
    const back = () => uxEnd(s, () => showTitle());
    s.onKey = back;
    uxBind(root, { back, wardrobe: () => uxEnd(s, () => showWardrobe(true)) });
    root.querySelectorAll('[data-hero]').forEach(g => {
      g.addEventListener('click', () => {
        const who = g.getAttribute('data-hero');
        uxNudge(g); uxLine('me_' + who, { interrupt: true });
      });
    });
    uxLine('me_labrador');
  }

  /* ---------- Pup Gear Locker / Wardrobe ---------- */
  function showWardrobe(fromMeet) {
    const s = uxScreen('wardrobe');
    const stars = totalStarsCount();
    const hats = ['wreath', 'detective', 'crown'];
    const render = () => {
      if (!uxAlive(s)) return;
      const oS = save.outfit.skye, oL = save.outfit.labrador;
      const dressBtns = (who, cx) => [0, 1, 2].map((d, k) => {
        const need = d === 0 ? 0 : (d === 1 ? WARDROBE_UNLOCKS.d1 : WARDROBE_UNLOCKS.d2);
        const open = stars >= need, active = save.outfit[who].dress === d;
        const cols = who === 'skye' ? ['#ff7cb8', '#5ecbff', '#a48bff'] : ['#2e4c85', '#34945e', '#c94b5b'];
        return `<g class="ux-btn" data-who="${who}" data-kind="dress" data-val="${d}" data-state="${open ? (active ? 'on' : 'open') : 'lock'}" role="button" tabindex="${open ? 0 : -1}" transform="translate(${cx + (k - 1) * 76} 376)">
          <g class="btn-vis" filter="url(#softShadow)">
            <circle r="32" fill="#fffaf0" stroke="${active ? '#ffd27a' : '#8cb67d'}" stroke-width="${active ? 5 : 2.5}"/>
            <circle r="21" fill="${cols[d]}" opacity="${open ? 1 : .28}"/>
          </g>
        </g>`;
      }).join('');
      const hatBtns = (who, cx) => [null, ...hats].map((h, k) => {
        const need = h ? WARDROBE_UNLOCKS[h] : 0, open = stars >= need, active = save.outfit[who].hat === h;
        const x = cx + (k - 1.5) * 68;
        const inner = h && SIZES['hat_' + h]
          ? `<image href="${SRC('hat_' + h)}" x="-22" y="-22" width="44" height="44" preserveAspectRatio="xMidYMid meet" opacity="${open ? 1 : .28}"/>`
          : `<text class="latin" y="8" text-anchor="middle" font-size="24" fill="#6b7f70">✕</text>`;
        return `<g class="ux-btn" data-who="${who}" data-kind="hat" data-val="${h || ''}" data-state="${open ? (active ? 'on' : 'open') : 'lock'}" role="button" tabindex="${open ? 0 : -1}" transform="translate(${x} 454)">
          <g class="btn-vis" filter="url(#softShadow)">
            <circle r="32" fill="#fffaf0" stroke="${active ? '#ffd27a' : '#8cb67d'}" stroke-width="${active ? 5 : 2.5}"/>${inner}
          </g>
        </g>`;
      }).join('');

      const root = uxPaint(`<g class="page">
        <image href="${SRC('bg_woods')}" width="960" height="520" preserveAspectRatio="xMidYMid slice"/>
        <rect width="960" height="520" fill="#112219" opacity=".6"/>
        <rect x="115" y="70" width="320" height="252" rx="28" fill="#fbe8f1" stroke="#ffd27a" stroke-width="4" filter="url(#softShadow)"/>
        <rect x="525" y="70" width="320" height="252" rx="28" fill="#e6efe4" stroke="#ffd27a" stroke-width="4" filter="url(#softShadow)"/>
        <g id="wdSkye" transform="translate(275 294) scale(1.45)"></g>
        <g id="wdLab" transform="translate(685 300) scale(1.32)"></g>
        ${dressBtns('skye', 275)}${hatBtns('skye', 275)}
        ${dressBtns('labrador', 685)}${hatBtns('labrador', 685)}
        ${uxButton({ act: 'back', ui: 'back', icon: 'back', x: 56, y: 48, r: 34 })}
      </g>`);

      if (typeof renderPupNode === 'function') {
        renderPupNode(root.querySelector('#wdSkye'), 'skye', 'cheer', oS);
        renderPupNode(root.querySelector('#wdLab'), 'labrador', 'cheer', oL);
      }

      const back = () => { saveWrite(); uxEnd(s, () => (fromMeet ? showMeet() : showTitle())); };
      s.onKey = back;
      uxBind(root, { back });
      root.querySelectorAll('[data-who]').forEach(btn => {
        if (btn.getAttribute('data-state') === 'lock') return;
        const pick = () => {
          const who = btn.getAttribute('data-who'), kind = btn.getAttribute('data-kind'), val = btn.getAttribute('data-val');
          if (kind === 'dress') save.outfit[who].dress = Number(val);
          else save.outfit[who].hat = val || null;
          saveWrite(); uxSfx('star'); uxLine('cheer_' + (1 + Math.floor(Math.random() * 2)));
          render();
        };
        btn.addEventListener('click', pick);
        btn.addEventListener('keydown', /** @param {KeyboardEvent} e */ e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } });
      });
    };
    render();
  }
  /* Stage resizing (Retina hdFit), portrait pause check, pointer parallax, keyboard navigation & gamepad gold focus ring. */
  const inputView = { panX: 0, targetPan: 0, fsTipAt: 0 };
  let fitRaf = 0;

  const isPortraitView = () => window.matchMedia('(orientation: portrait)').matches && window.matchMedia('(pointer: coarse)').matches;

  function applyFit() {
    fitRaf = 0;
    const availW = window.innerWidth, availH = window.innerHeight;
    const cssW = layoutStageWidth(availW, availH);
    const stage = $('stage');
    if (stage) {
      stage.style.width = cssW + 'px';
      stage.style.height = layoutStageHeight(cssW) + 'px';
      hdFit(cssW);
    }
    if (typeof refreshAudioGains === 'function') refreshAudioGains();
    if (isPortraitView() && typeof voice !== 'undefined') voice.suspend();
  }

  function fitStageSoon() { if (!fitRaf) fitRaf = requestAnimationFrame(applyFit); }
  window.addEventListener('resize', fitStageSoon);
  window.addEventListener('orientationchange', fitStageSoon);
  applyFit();

  function toggleFullscreen() {
    const doc = document, elRoot = document.documentElement;
    const active = doc.fullscreenElement || doc.webkitFullscreenElement;
    if (active) {
      if (doc.exitFullscreen) doc.exitFullscreen().catch(() => {});
      else if (doc.webkitExitFullscreen) doc.webkitExitFullscreen();
    } else {
      if (elRoot.requestFullscreen) elRoot.requestFullscreen().catch(() => {});
      else if (elRoot.webkitRequestFullscreen) elRoot.webkitRequestFullscreen();
    }
  }

  $('stage').addEventListener('pointermove', e => {
    const r = $('stage').getBoundingClientRect();
    if (r.width > 0) inputView.targetPan = Math.max(-1, Math.min(1, ((e.clientX - r.left) / r.width - .5) * 2));
  });

  window.addEventListener('keydown', e => {
    if (uxState.modal) return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'ArrowDown') {
      const dir = e.key === 'ArrowRight' ? 'r' : e.key === 'ArrowLeft' ? 'l' : e.key === 'ArrowDown' ? 'd' : 'u';
      if (movePadFocus(dir)) e.preventDefault();
    } else if (e.key === 'Enter' || e.key === ' ') {
      const active = document.activeElement;
      if (active && $('stage').contains(active) && active instanceof HTMLElement) return;
      if (story && story.onKey) { e.preventDefault(); story.onKey(); }
    } else if (e.key === 'Escape' && story && story.name !== 'title' && story.name !== 'finale') {
      const back = $('overlay').querySelector('[data-act="back"]');
      if (back) back.dispatchEvent(new MouseEvent('click'));
    }
  });

  /* Gamepad & keyboard focus ring navigation over visible clickable stage elements */
  let padCur = -1, padLastMove = 0, padLastA = false, padLastB = false;

  function interactiveTargets() {
    const scope = uxState.modal ? $('modal') : storyIsOpen() ? $('overlay') : $('hotspots').children.length ? $('hotspots') : $('workshop');
    if (!scope) return [];
    const nodes = [...scope.querySelectorAll('[role="button"]:not([data-state="lock"]), .stone-btn, .hotspot')];
    return nodes.map(node => {
      const b = node.getBoundingClientRect();
      const s = $('stage').getBoundingClientRect();
      const k = s.width > 0 ? 960 / s.width : 1;
      return {
        node,
        pulse: node.classList.contains('ux-pulse'),
        x: (b.left - s.left) * k, y: (b.top - s.top) * k,
        w: b.width * k, h: b.height * k,
      };
    }).filter(r => r.w > 10 && r.h > 10);
  }

  function showPadRing(r) {
    const pf = $('padFocus');
    if (!pf) return;
    if (!r) { pf.setAttribute('visibility', 'hidden'); return; }
    const rect = pf.querySelector('rect');
    rect.setAttribute('x', (r.x - 4).toFixed(1)); rect.setAttribute('y', (r.y - 4).toFixed(1));
    rect.setAttribute('width', (r.w + 8).toFixed(1)); rect.setAttribute('height', (r.h + 8).toFixed(1));
    pf.setAttribute('visibility', 'visible');
  }

  function movePadFocus(dir) {
    const list = interactiveTargets();
    if (!list.length) { showPadRing(null); return false; }
    if (padCur < 0 || padCur >= list.length) {
      padCur = layoutPadStart(list);
      showPadRing(list[padCur]);
      return true;
    }
    const next = layoutPadPick(dir, padCur, list);
    if (next >= 0) {
      padCur = next;
      showPadRing(list[padCur]);
      list[padCur].node.dispatchEvent(new Event('focus'));
      return true;
    }
    return false;
  }

  function padTick(now) {
    const pads = navigator.getGamepads ? navigator.getGamepads() : null;
    const p = pads && pads[0];
    if (!p) { if (!document.activeElement || document.activeElement === document.body) showPadRing(null); return; }
    const ax = p.axes[0] || 0, ay = p.axes[1] || 0;
    const l = (p.buttons[14] && p.buttons[14].pressed) || ax < -.5;
    const r = (p.buttons[15] && p.buttons[15].pressed) || ax > .5;
    const u = (p.buttons[12] && p.buttons[12].pressed) || ay < -.5;
    const d = (p.buttons[13] && p.buttons[13].pressed) || ay > .5;
    if ((l || r || u || d) && now - padLastMove > .22) {
      padLastMove = now;
      movePadFocus(r ? 'r' : l ? 'l' : d ? 'd' : 'u');
    }
    const aPressed = !!(p.buttons[0] && p.buttons[0].pressed);
    if (aPressed && !padLastA) {
      const list = interactiveTargets();
      if (padCur >= 0 && list[padCur]) list[padCur].node.dispatchEvent(new MouseEvent('click'));
    }
    padLastA = aPressed;
    const bPressed = !!(p.buttons[1] && p.buttons[1].pressed);
    if (bPressed && !padLastB) {
      const back = $('overlay').querySelector('[data-act="back"]');
      if (back) back.dispatchEvent(new MouseEvent('click'));
    }
    padLastB = bPressed;
  }
  /* Orchestration: main game flow, Scene A / Scene B interactive handlers, animation loop, dev QA hooks & offline worker. */
  const playFlow = { phase: 'title', prevIdx: null, workshopQueued: false };
  const uxHooksReady = () => { uxHooks.replay = i => openRoom(i, true); };
  uxHooksReady();

  function registerOfflineWorker() {
    if (!offlineWorkerAllowed(location.search, location.protocol, 'serviceWorker' in navigator)) return;
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  function onSettingChanged(key, value) {
    if (key === 'sound') { muted = !value; if (typeof refreshAudioGains === 'function') refreshAudioGains(); }
    if (key === 'subtitles' && typeof TK !== 'undefined') TK.refreshSubtitles();
  }

  function roomArtSet(idx, extraWords) {
    const lv = LEVELS[idx];
    if (!lv) return [];
    return roomArt(lv, LINES, { wear: save.outfit, extraWords: extraWords || [], last: idx === LEVELS.length - 1 });
  }

  function onStartJourney() {
    const idx = nextRoomIndex();
    const go = () => openRoom(idx);
    if (!save.flags.prologue && idx === 0) {
      loadArt(assetPlan(LEVELS, LINES, { wear: save.outfit }).prologue, ART_PATIENCE).then(() => {
        save.flags.prologue = true; saveWrite();
        showStory(['p1', 'p2', 'p3'], go);
      });
    } else go();
  }

  function openRoom(idx, skipRecall) {
    const lv = LEVELS[idx];
    if (!lv) return;
    const prevIdx = playFlow.prevIdx;
    const prevLv = !skipRecall && prevIdx != null && prevIdx !== idx ? LEVELS[prevIdx] : null;
    const recallIds = prevLv ? recallWordsFor(prevLv.words, save.words, reviewContext(save)) : [];
    const needArt = roomArtSet(idx, recallIds);
    playFlow.phase = 'story';
    playFlow.workshopQueued = false;

    loadArt(needArt, ART_PATIENCE).then(() => {
      const startPlay = () => {
        reviewAdvanceClock(save); saveWrite();
        playFlow.phase = 'play';
        game.start(idx);
        sceneDrawn.idx = -1;
        renderStage(game, true);
        syncHud();
        talkOnEvents(game.drain(), game);
      };
      const showCard = () => showChapter(idx, startPlay);
      if (recallIds.length) showRecall(prevLv, showCard, recallIds);
      else showCard();
    });
  }

  function onHudReplay() {
    if (game.state !== 'play') return;
    playFlow.workshopQueued = false;
    game.start(game.index);
    sceneDrawn.idx = -1;
    renderStage(game, true);
    syncHud();
    talkOnEvents(game.drain(), game);
  }

  function onHotspotClick(id) {
    if (!canPlay() || game.screen !== 0) return;
    unlockAudio();
    const h = game.hotspots.find(x => x.id === id);
    if (!h || h.opened) return;
    const prevReady = game.workshopReady;
    if (!game.tapHotspot(id)) return;
    if (h.kind === 'word') spawnOrbArc(h.x, h.y, 130, 45);
    uxConfetti($('fx'), h.x, h.y, h.kind === 'word' ? 16 : 12);
    renderStage(game, false);
    const evs = game.drain();
    audioOnEvents(evs, game);
    talkOnEvents(evs, game);
    if (!prevReady && game.workshopReady && game.screen === 0 && !playFlow.workshopQueued) {
      playFlow.workshopQueued = true;
      setTimeout(() => {
        if (game.state === 'play' && game.screen === 0 && !storyIsOpen()) onEnterWorkshop();
      }, 2600);
    }
  }

  function onEnterWorkshop() {
    if (!canPlay() || game.screen !== 0) return;
    unlockAudio();
    if (!game.enterWorkshop(false)) return;
    uxSfx('page');
    renderStage(game, false);
    const evs = game.drain();
    audioOnEvents(evs, game);
    talkOnEvents(evs, game);
  }

  let lastHoverStone = { chunk: '', t: 0 };
  function onStoneHover(chunk) {
    if (!canPlay() || game.screen !== 1) return;
    const now = performance.now();
    if (chunk === lastHoverStone.chunk && now - lastHoverStone.t < 450) return;
    lastHoverStone = { chunk, t: now };
    if (hasLineKey('ph_' + chunk)) voice.line('ph_' + chunk, { interrupt: true, priority: 0, tag: 'ui', maxWait: 500, subtitle: false });
  }

  function onStoneClick(chunk, btnNode) {
    if (!canPlay() || game.screen !== 1) return;
    unlockAudio();
    const ok = game.tapStone(chunk);
    const evs = game.drain();
    audioOnEvents(evs, game);
    talkOnEvents(evs, game);
    if (!ok) {
      uxNudge(btnNode);
      renderStage(game, false);
      return;
    }
    const blended = evs.find(e => e.type === 'word_blended');
    if (blended) {
      const wsAn = $('wsAnimal');
      if (wsAn) { wsAn.classList.add('ux-anim-pulse'); uxConfetti($('fx'), 480, 202, 26); }
    }
    if (game.state === 'clear' || game.state === 'win') {
      const lvIdx = game.index;
      setTimeout(() => completeRoom(lvIdx), 1700);
      return;
    }
    if (blended) {
      setTimeout(() => { if (game.state === 'play') renderStage(game, false); }, 1350);
    } else {
      renderStage(game, false);
    }
  }

  function onPupTap(who) {
    if (!canPlay()) return;
    unlockAudio();
    game.cheerFriend(who);
    const pt = who === 'skye' ? game.skye : game.labrador;
    uxConfetti($('fx'), pt.x, pt.y - 45, 14);
    const evs = game.drain();
    audioOnEvents(evs, game);
    talkOnEvents(evs, game);
  }

  function openMemoryOverlay(memId) {
    showMemory(game.level(), memId, () => {
      playFlow.phase = 'play';
      syncHud();
    });
  }

  function triggerHint() {
    if (!canPlay()) return;
    unlockAudio();
    game.idleTime = 12;
    game.hintTarget = game.computeHintTarget();
    uxSfx('tap');
    voice.line('idle_' + (1 + Math.floor(Math.random() * 4)), { interrupt: true, tag: 'hint', maxWait: 3000 });
  }

  function completeRoom(lvIdx) {
    const lv = LEVELS[lvIdx];
    playFlow.phase = 'clear';
    playFlow.prevIdx = lvIdx;
    const acornsAll = !game.acorns || game.acorns.total === 0 ? true : game.acorns.got >= game.acorns.total;
    markRoom(lv.id, { cleared: true, memory: !!game.memoryFound, stars: [true, !!game.memoryFound, acornsAll] });
    for (const wid of lv.words) if (!save.stickers.includes(wid)) save.stickers.push(wid);
    saveWrite();

    showClear(lvIdx, () => {
      if (lvIdx >= LEVELS.length - 1) {
        const endPlan = assetPlan(LEVELS, LINES, { wear: save.outfit });
        loadArt(endPlan.ending, ART_PATIENCE).then(() => showStory(['win', 'end'], () => showFinale(showTitle)));
      } else {
        openRoom(lvIdx + 1);
      }
    });
  }

  /* Main loop */
  let lastT = performance.now(), secAcc = 0;
  function frame(now) {
    const dt = Math.min(.05, (now - lastT) / 1000);
    lastT = now;
    const tSec = now / 1000;
    inputView.panX += (inputView.targetPan - inputView.panX) * Math.min(1, dt * 6);
    if (canPlay()) {
      game.step(dt);
      const evs = game.drain();
      if (evs.length) { audioOnEvents(evs, game); talkOnEvents(evs, game); }
      renderPups(game, tSec);
      secAcc += dt;
      if (secAcc >= 1) { save.totalPlaySeconds += Math.floor(secAcc); secAcc %= 1; saveSoon(); }
    }
    updateAmbientMotion(tSec, inputView.panX);
    fxTick(dt, tSec, game);
    audioTick();
    padTick(tSec);
    requestAnimationFrame(frame);
  }

  /* Boot sequence: preload title set (< 2.5 MB), render Title (or DEV ?dev=1&qa=...) */
  const titlePlan = assetPlan(LEVELS, LINES, { wear: save.outfit });
  const qaMode = DEV ? new URLSearchParams(location.search).get('qa') : null;
  if (DEV && qaMode === 'unlock') {
    save.unlocked.rooms = LEVELS.length;
    for (const lv of LEVELS) markRoom(lv.id, { cleared: true, memory: true, stars: [true, true, true] });
    for (const w of WORDS) if (w.kind === 'core' && !save.stickers.includes(w.id)) save.stickers.push(w.id);
    save.outfit.skye = { dress: 1, hat: 'wreath' };
    save.outfit.labrador = { dress: 1, hat: 'detective' };
  }

  loadArt(titlePlan.title, ART_PATIENCE).then(() => {
    registerOfflineWorker();
    if (DEV && qaMode === 'win') {
      save.unlocked.rooms = LEVELS.length;
      for (const lv of LEVELS) markRoom(lv.id, { cleared: true, memory: true, stars: [true, true, true] });
      for (const w of WORDS) {
        if (w.kind !== 'core') continue;
        if (!save.stickers.includes(w.id)) save.stickers.push(w.id);
        save.words[w.id] = { heard: 8, quiz: 1, seen: true };
      }
      save.outfit.skye = { dress: 1, hat: 'crown' };
      save.outfit.labrador = { dress: 2, hat: 'detective' };
      loadArt(titlePlan.ending, ART_PATIENCE).then(() => showStory(['win', 'end'], () => showFinale(showTitle)));
    } else {
      showTitle();
    }
    requestAnimationFrame(frame);
  });
})();
</script>
</body>
